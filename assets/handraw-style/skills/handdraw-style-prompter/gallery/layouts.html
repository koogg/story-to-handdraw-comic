:root{color:#24211e;background:#f7f5f0;font:16px/1.5 system-ui,"Microsoft YaHei",sans-serif} body{margin:0} main{max-width:1440px;margin:auto;padding:18px 30px 30px} .sticky-header{position:sticky;top:0;z-index:100} .site-nav{display:flex;align-items:center;gap:10px;margin:0;padding:12px 30px;border-bottom:1px solid #ded8cf;background:#fffdf9} .site-nav a{border:1px solid #9e9185;border-radius:8px;background:#fff;color:#403a34;padding:7px 13px;text-decoration:none;font-weight:800;line-height:1.2;transition:background .15s,color .15s,border-color .15s} .site-nav a:hover{border-color:#b74227;background:#fff0eb;color:#9f351f} .site-nav a[aria-current="page"]{border-color:#b74227;background:#b74227;color:#fff;box-shadow:0 1px 3px #b7422744} .nav-right{margin-left:auto;display:flex;align-items:center;gap:8px} .nav-ext{display:inline-flex;align-items:center;font-weight:700} .nav-btn{border:1px solid #9e9185;border-radius:8px;background:#fff;color:#403a34;padding:7px 13px;font:inherit;font-weight:700;line-height:1.2;cursor:pointer;transition:background .15s,color .15s,border-color .15s} .nav-btn:hover{border-color:#b74227;background:#fff0eb;color:#9f351f} .nav-btn:focus-visible,.site-nav a:focus-visible{outline:3px solid #d67d4d;outline-offset:3px} .sub-nav{display:flex;gap:10px;align-items:center;padding:9px 30px;background:#faf7f2;border-bottom:1px solid #ded8cf;box-shadow:0 2px 6px rgba(0,0,0,0.03)} .filter{display:inline-flex;align-items:center;gap:6px;border:1px solid #c9c1b6;border-radius:6px;background:#fff;color:#514a43;padding:6px 14px;font:inherit;font-size:14px;font-weight:600;line-height:1.4;cursor:pointer;transition:background .15s,color .15s,border-color .15s,box-shadow .15s} .filter:hover{border-color:#b74227;color:#b74227;background:#fff8f5} .filter span{display:inline-block;padding:1px 6px;border-radius:999px;background:#eee8df;color:#6b6257;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;transition:all .15s} .filter.is-active{border-color:#b74227;background:#b74227;color:#fff;box-shadow:0 1px 3px rgba(183,66,39,0.3)} .filter.is-active span{background:rgba(255,255,255,0.25);color:#fff} h1{margin:0} .lead{margin:8px 0 20px;color:#665f57}
.gallery-title-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:0 0 2px}
.gallery-title-bar h1{margin:0;font-size:26px;font-weight:800;color:#24211e;line-height:1.2}
.size-switcher{display:inline-flex;align-items:center;gap:6px;background:#eee8df;padding:3px 6px;border-radius:8px;border:1px solid #dcd5ca;margin-left:auto}

.size-btn-group{display:inline-flex;align-items:center;gap:3px}

/* 2x Default: standard size (4 columns on desktop) */
.gallery{--columns:4;--gap:18px;display:grid;grid-template-columns:repeat(var(--columns),minmax(0,1fr));gap:var(--gap);align-items:start}
.masonry-column{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.layout-card{display:block;box-sizing:border-box;position:relative;width:100%;margin:0;padding:0;border:0;border-radius:12px;background:#fff;box-shadow:0 1px 5px #0002;overflow:hidden;cursor:zoom-in;text-align:left}

.layout-card img{display:block;width:100%;height:auto}
.layout-info{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 12px;background:#fffdf9}
.layout-id{color:#b74227;font-weight:850;font-variant-numeric:tabular-nums;white-space:nowrap}
.layout-name{overflow:hidden;color:#514a43;font-size:13px;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:1100px){.gallery{--columns:3}}
@media(max-width:720px){main{padding:16px 20px 20px} .site-nav{padding:10px 20px;flex-wrap:wrap;gap:8px} .nav-right{width:100%;justify-content:flex-start;gap:6px;margin-left:0} .site-nav a,.nav-btn{padding:6px 10px;font-size:13px} .sub-nav{padding:8px 20px;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch} .filter{padding:5px 10px;font-size:13px;white-space:nowrap} .gallery{--columns:2;--gap:12px} .layout-info{display:block;padding:8px 10px} .layout-name{display:block;margin-top:2px}}
@media(max-width:420px){.gallery{--columns:1}}

/* 1x: compact half size (8 columns on desktop) */
[data-size="1x"] .gallery{--columns:8;--gap:10px}
[data-size="1x"] .layout-card{border-radius:8px;box-shadow:0 1px 4px #0002}
[data-size="1x"] .layout-info{display:flex;align-items:baseline;justify-content:space-between;gap:6px;padding:6px 8px}
[data-size="1x"] .layout-id{font-size:11.5px}

@media(max-width:720px){[data-size="1x"] .gallery{--columns:4;--gap:8px} [data-size="1x"] .layout-info{display:block;padding:5px 6px}}
@media(max-width:480px){[data-size="1x"] .gallery{--columns:2;--gap:6px}}

<p class="lead" data-i18n="lead">浏览排版图型，点击缩略图放大查看并复制对应排版提示词。</p>
<section id="gallery" class="gallery"><button class="layout-card" type="button" data-id="SC-001" data-category="social-card" data-image="../../../images/layouts/social-cards/SC-001.webp" data-prompt="小红书社媒卡。排版采用上文下图结构：上方集中放置主题文字和简短补充文案，下方放置完整主图或场景图。上下内容保持清晰的阅读顺序，图文关系自然，整体构图简洁。" data-prompt-zh="小红书社媒卡。排版采用上文下图结构：上方集中放置主题文字和简短补充文案，下方放置完整主图或场景图。上下内容保持清晰的阅读顺序，图文关系自然，整体构图简洁。" data-prompt-en="Xiaohongshu social-media card. Use a text-above-image layout: place the theme copy and concise supporting text in the upper section, with a complete primary or scene illustration below. Keep a clear top-to-bottom reading order, let the text and image relate naturally, and keep the overall composition simple." data-name="上文下图社媒卡" data-name-zh="上文下图社媒卡" data-name-en="Text-Above-Image Social Card" aria-label="查看 SC-001 上文下图社媒卡"><img src="../../../images/layouts/social-cards/SC-001.webp" alt="SC-001 上文下图社媒卡"><span class="layout-info"><span class="layout-id">SC-001</span><span class="layout-name">上文下图社媒卡</span></span></button>
<button class="layout-card" type="button" data-id="SC-002" data-category="social-card" data-image="../../../images/layouts/social-cards/SC-002.webp" data-prompt="小红书社媒卡。排版：视觉主体是文字，底部简单图案起辅助作用，图文之间有较大空间。纯色背景，较多留白空间，构图简单。" data-prompt-zh="小红书社媒卡。排版：视觉主体是文字，底部简单图案起辅助作用，图文之间有较大空间。纯色背景，较多留白空间，构图简单。" data-prompt-en="Xiaohongshu social-media card. Layout: text is the visual focal point; a simple graphic at the bottom plays a supporting role, with generous separation between text and image. Solid-color background, ample negative space, and a simple composition." data-name="文案主导底部辅助图卡" data-name-zh="文案主导底部辅助图卡" data-name-en="Text-Dominant Bottom-Graphic Card" aria-label="查看 SC-002 文案主导底部辅助图卡"><img src="../../../images/layouts/social-cards/SC-002.webp" alt="SC-002 文案主导底部辅助图卡"><span class="layout-info"><span class="layout-id">SC-002</span><span class="layout-name">文案主导底部辅助图卡</span></span></button>
<button class="layout-card" type="button" data-id="SC-003" data-category="social-card" data-image="../../../images/layouts/social-cards/SC-003.webp" data-prompt="小红书社媒卡。排版：无独立标题，根据主题创作。上下带框两宫格，每一格都是上面一行字，下面配图，图文无明显分界，纯色背景，较多留白空间，角色高度概括，构图简单。" data-prompt-zh="小红书社媒卡。排版：无独立标题，根据主题创作。上下带框两宫格，每一格都是上面一行字，下面配图，图文无明显分界，纯色背景，较多留白空间，角色高度概括，构图简单。" data-prompt-en="Xiaohongshu social-media card. Layout: no separate headline; create from the theme. Two framed panels stacked vertically; each panel has one line of text above an illustration, with no hard text-image division. Solid-color background, generous negative space, highly simplified characters, and a simple composition." data-name="上下双格图文卡" data-name-zh="上下双格图文卡" data-name-en="Two-Panel Stacked Card" aria-label="查看 SC-003 上下双格图文卡"><img src="../../../images/layouts/social-cards/SC-003.webp" alt="SC-003 上下双格图文卡"><span class="layout-info"><span class="layout-id">SC-003</span><span class="layout-name">上下双格图文卡</span></span></button>
<button class="layout-card" type="button" data-id="SC-004" data-category="social-card" data-image="../../../images/layouts/social-cards/SC-004.webp" data-prompt="小红书社媒卡。排版：无独立标题，根据主题创作。上下带框两宫格，每一格都有一个图区和一个文字区，文字区可以在图的上方、左侧或右侧，文字区显示简单文案不做过多扩写，纯色背景，较多留白空间，角色高度概括，构图简单。" data-prompt-zh="小红书社媒卡。排版：无独立标题，根据主题创作。上下带框两宫格，每一格都有一个图区和一个文字区，文字区可以在图的上方、左侧或右侧，文字区显示简单文案不做过多扩写，纯色背景，较多留白空间，角色高度概括，构图简单。" data-prompt-en="Xiaohongshu social-media card. Layout: no separate headline; create from the theme. Two framed panels stacked vertically; every panel has an image area and a text area. The text area may sit above, left, or right of the image and contains concise copy without excessive expansion. Solid-color background, generous negative space, highly simplified characters, and a simple composition." data-name="上下双格图文分区卡" data-name-zh="上下双格图文分区卡" data-name-en="Two-Panel Split Section Card" aria-label="查看 SC-004 上下双格图文分区卡"><img src="../../../images/layouts/social-cards/SC-004.webp" alt="SC-004 上下双格图文分区卡"><span class="layout-info"><span class="layout-id">SC-004</span><span class="layout-name">上下双格图文分区卡</span></span></button>
<button class="layout-card" type="button" data-id="SC-005" data-category="social-card" data-image="../../../images/layouts/social-cards/SC-005.webp" data-prompt="小红书社媒卡。排版：无独立标题，视觉重点是使用主题的气泡文字，左下或右下放置一个思考状 IP 形象，构图简单，大面积留白。" data-prompt-zh="小红书社媒卡。排版：无独立标题，视觉重点是使用主题的气泡文字，左下或右下放置一个思考状 IP 形象，构图简单，大面积留白。" data-prompt-en="Xiaohongshu social-media card. Layout: no separate headline; the visual focus is a thought-bubble text based on the theme, with a thinking IP character placed in the lower-left or lower-right. Keep the composition simple with generous negative space." data-name="气泡文字思考IP卡" data-name-zh="气泡文字思考IP卡" data-name-en="Thought-Bubble Character Card" aria-label="查看 SC-005 气泡文字思考IP卡"><img src="../../../images/layouts/social-cards/SC-005.webp" alt="SC-005 气泡文字思考IP卡"><span class="layout-info"><span class="layout-id">SC-005</span><span class="layout-name">气泡文字思考IP卡</span></span></button>
<button class="layout-card" type="button" data-id="SC-006" data-category="social-card" data-image="../../../images/layouts/social-cards/SC-006.webp" data-prompt="小红书社媒卡。排版分为三层：上层放置主标题，中层放置一张尺寸较小、起辅助作用的简单图形，下层放置副标题。使用纯色背景，保留较多留白空间，整体构图简单。" data-prompt-zh="小红书社媒卡。排版分为三层：上层放置主标题，中层放置一张尺寸较小、起辅助作用的简单图形，下层放置副标题。使用纯色背景，保留较多留白空间，整体构图简单。" data-prompt-en="Xiaohongshu social-media card. Use a three-level layout: place the main headline in the upper section, a small simple supporting illustration in the middle, and a secondary headline in the lower section. Use a solid-color background, generous negative space, and a simple overall composition." data-name="三层标题辅助图卡" data-name-zh="三层标题辅助图卡" data-name-en="Three-Tier Headline Graphic Card" aria-label="查看 SC-006 三层标题辅助图卡"><img src="../../../images/layouts/social-cards/SC-006.webp" alt="SC-006 三层标题辅助图卡"><span class="layout-info"><span class="layout-id">SC-006</span><span class="layout-name">三层标题辅助图卡</span></span></button>
<button class="layout-card" type="button" data-id="SC-007" data-category="social-card" data-image="../../../images/layouts/social-cards/SC-007.webp" data-prompt="小红书文字型社媒卡。排版：左上放置一个醒目的双引号，中间呈现主题文案并将关键词重点化，右下放置一条下划线；句末可以添加与文字大小适配的 emoji。保持文字主导的简洁构图。" data-prompt-zh="小红书文字型社媒卡。排版：左上放置一个醒目的双引号，中间呈现主题文案并将关键词重点化，右下放置一条下划线；句末可以添加与文字大小适配的 emoji。保持文字主导的简洁构图。" data-prompt-en="Xiaohongshu text-led social-media card. Layout: place a prominent opening quotation mark in the upper-left, present the theme copy in the center with key words emphasized, and add an underline in the lower-right. An emoji may appear at the end of the sentence, sized to match the text. Keep the composition simple and typography-led." data-name="引号关键词文字卡" data-name-zh="引号关键词文字卡" data-name-en="Quote Keyword Typography Card" aria-label="查看 SC-007 引号关键词文字卡"><img src="../../../images/layouts/social-cards/SC-007.webp" alt="SC-007 引号关键词文字卡"><span class="layout-info"><span class="layout-id">SC-007</span><span class="layout-name">引号关键词文字卡</span></span></button>
<button class="layout-card" type="button" data-id="SC-008" data-category="social-card" data-image="../../../images/layouts/social-cards/SC-008.webp" data-prompt="小红书社媒卡。排版采用图上文下结构，上方是高度概括的角色或场景图，下方是主题文案；图文之间不设置明显界线，让视觉自然衔接。使用纯色背景，保留较多留白空间，整体构图简单。" data-prompt-zh="小红书社媒卡。排版采用图上文下结构，上方是高度概括的角色或场景图，下方是主题文案；图文之间不设置明显界线，让视觉自然衔接。使用纯色背景，保留较多留白空间，整体构图简单。" data-prompt-en="Xiaohongshu social-media card. Use an image-above-text layout, with a highly simplified character or scene illustration above and the theme copy below. Do not add a visible boundary between the image and text; let them flow together naturally. Use a solid-color background, generous negative space, and a simple overall composition." data-name="图上文下留白卡" data-name-zh="图上文下留白卡" data-name-en="Image-Above-Text Whitespace Card" aria-label="查看 SC-008 图上文下留白卡"><img src="../../../images/layouts/social-cards/SC-008.webp" alt="SC-008 图上文下留白卡"><span class="layout-info"><span class="layout-id">SC-008</span><span class="layout-name">图上文下留白卡</span></span></button>
<button class="layout-card" type="button" data-id="SC-009" data-category="social-card" data-image="../../../images/layouts/social-cards/SC-009.webp" data-prompt="小红书文字型社媒卡。排版：主题文字作为视觉主体，居中显示；右下角放置一个简单的小图作为辅助，不抢夺文字的视觉重点。整体构图简洁。" data-prompt-zh="小红书文字型社媒卡。排版：主题文字作为视觉主体，居中显示；右下角放置一个简单的小图作为辅助，不抢夺文字的视觉重点。整体构图简洁。" data-prompt-en="Xiaohongshu text-led social-media card. Layout: make the theme text the visual focus and center it in the composition; place a small simple illustration in the lower-right corner as supporting content without competing with the text. Keep the overall composition simple." data-name="居中文字右下辅助图卡" data-name-zh="居中文字右下辅助图卡" data-name-en="Centered Text Corner Graphic Card" aria-label="查看 SC-009 居中文字右下辅助图卡"><img src="../../../images/layouts/social-cards/SC-009.webp" alt="SC-009 居中文字右下辅助图卡"><span class="layout-info"><span class="layout-id">SC-009</span><span class="layout-name">居中文字右下辅助图卡</span></span></button>
<button class="layout-card" type="button" data-id="SC-010" data-category="social-card" data-image="../../../images/layouts/social-cards/SC-010.webp" data-prompt="小红书社媒卡。排版：无独立标题，根据主题创作上下带框的两宫格。每一格包含一行标题、约两三行的简短 list 文字和一张简单配图；文字保持简洁，不做过多扩写，图文之间不设置明显分界。使用纯色背景，保留较多留白空间，角色高度概括，整体构图简单。" data-prompt-zh="小红书社媒卡。排版：无独立标题，根据主题创作上下带框的两宫格。每一格包含一行标题、约两三行的简短 list 文字和一张简单配图；文字保持简洁，不做过多扩写，图文之间不设置明显分界。使用纯色背景，保留较多留白空间，角色高度概括，整体构图简单。" data-prompt-en="Xiaohongshu social-media card. Layout: create two stacked framed panels based on the theme, without a separate overall headline. Each panel contains a one-line heading, a concise two- or three-line list, and a simple supporting illustration. Keep the copy brief without over-expanding it, avoid a visible boundary between text and image, use a solid-color background with generous negative space, simplify the characters, and keep the composition simple." data-name="上下双格标题列表卡" data-name-zh="上下双格标题列表卡" data-name-en="Two-Panel List &amp; Graphic Card" aria-label="查看 SC-010 上下双格标题列表卡"><img src="../../../images/layouts/social-cards/SC-010.webp" alt="SC-010 上下双格标题列表卡"><span class="layout-info"><span class="layout-id">SC-010</span><span class="layout-name">上下双格标题列表卡</span></span></button>
<button class="layout-card" type="button" data-id="SC-011" data-category="social-card" data-image="../../../images/layouts/social-cards/SC-011.webp" data-prompt="小红书社媒卡。排版：设置一个主标题，画面中央放置一个主图，周围安排 3–5 个与主体形象一致的简单信息图，并添加 2–3 个对主体的简短标注。使用纯色背景，保留较多留白空间，角色高度概括，整体构图简单。" data-prompt-zh="小红书社媒卡。排版：设置一个主标题，画面中央放置一个主图，周围安排 3–5 个与主体形象一致的简单信息图，并添加 2–3 个对主体的简短标注。使用纯色背景，保留较多留白空间，角色高度概括，整体构图简单。" data-prompt-en="Xiaohongshu social-media card. Layout: include a main headline, place one primary illustration in the center, surround it with 3–5 simple information illustrations that match the subject, and add 2–3 brief annotations about the subject. Use a solid-color background, generous negative space, highly simplified characters, and a simple overall composition." data-name="中心主图多场景信息卡" data-name-zh="中心主图多场景信息卡" data-name-en="Central Hero Multi-Scene Card" aria-label="查看 SC-011 中心主图多场景信息卡"><img src="../../../images/layouts/social-cards/SC-011.webp" alt="SC-011 中心主图多场景信息卡"><span class="layout-info"><span class="layout-id">SC-011</span><span class="layout-name">中心主图多场景信息卡</span></span></button>
<button class="layout-card" type="button" data-id="SC-012" data-category="social-card" data-image="../../../images/layouts/social-cards/SC-012.webp" data-prompt="小红书社媒卡。排版：标题垂直居中显示，标题上方整齐安排两行图标，标题下方也整齐安排两行图标，形成围绕中心标题的上下对称结构。保持图标排列清晰、构图简单。" data-prompt-zh="小红书社媒卡。排版：标题垂直居中显示，标题上方整齐安排两行图标，标题下方也整齐安排两行图标，形成围绕中心标题的上下对称结构。保持图标排列清晰、构图简单。" data-prompt-en="Xiaohongshu social-media card. Layout: center the headline vertically, arrange two neat rows of icons above it, and arrange two more neat rows of icons below it to form a balanced structure around the central headline. Keep the icon arrangement clear and the composition simple." data-name="中心标题上下图标卡" data-name-zh="中心标题上下图标卡" data-name-en="Center Title Top-Bottom Icon Card" aria-label="查看 SC-012 中心标题上下图标卡"><img src="../../../images/layouts/social-cards/SC-012.webp" alt="SC-012 中心标题上下图标卡"><span class="layout-info"><span class="layout-id">SC-012</span><span class="layout-name">中心标题上下图标卡</span></span></button>
<button class="layout-card" type="button" data-id="SC-014" data-category="social-card" data-image="../../../images/layouts/social-cards/SC-014.webp" data-prompt="小红书社媒卡。整体保留大面积留白。顶部设置 1–2 行醒目的短标题，与主体区域形成清晰层级；中下部设置一个占据主要面积的大型主视觉，主视觉可居中、偏左或偏右，不固定位置，并通过主体自身的轮廓、姿态和占位关系自然形成若干留白区域。将 4–6 个尺寸较小的信息单元穿插在这些留白区域中，每个单元由一个小视觉元素与极短文字组成，位置服从主视觉留下的空间，不平均环绕主体，不形成规则左右分栏。小信息单元应明显小于主视觉并贴合主体轮廓的空隙，可上下错落、疏密变化，不能使用统一卡片框、规则宫格、表格或明显分割线。底部可保留一句很短的总结文字作为收尾。整体强调主视觉优先、留白驱动、信息穿插，画面完整而非模块拼接。" data-prompt-zh="小红书社媒卡。整体保留大面积留白。顶部设置 1–2 行醒目的短标题，与主体区域形成清晰层级；中下部设置一个占据主要面积的大型主视觉，主视觉可居中、偏左或偏右，不固定位置，并通过主体自身的轮廓、姿态和占位关系自然形成若干留白区域。将 4–6 个尺寸较小的信息单元穿插在这些留白区域中，每个单元由一个小视觉元素与极短文字组成，位置服从主视觉留下的空间，不平均环绕主体，不形成规则左右分栏。小信息单元应明显小于主视觉并贴合主体轮廓的空隙，可上下错落、疏密变化，不能使用统一卡片框、规则宫格、表格或明显分割线。底部可保留一句很短的总结文字作为收尾。整体强调主视觉优先、留白驱动、信息穿插，画面完整而非模块拼接。" data-prompt-en="Xiaohongshu social-media card with generous negative space. Place a prominent one- or two-line short headline at the top, clearly separated from the main subject area. In the middle and lower area, place one large primary visual occupying most of the composition; it may be centered, left-weighted, or right-weighted rather than locked to one position. Let the primary visual&#x27;s silhouette, pose, and spatial footprint naturally create several areas of open space. Insert 4–6 smaller information units into those open spaces, each made of a small visual element and extremely short text. Let their positions follow the space left by the primary visual rather than preset columns; do not distribute them evenly around the subject or create regular side-by-side columns. Keep the small units clearly smaller than the primary visual and close to the gaps created by its outline, with varied vertical positions and density. Do not use uniform card frames, regular grids, tables, or obvious divider lines. A very short summary sentence may appear at the bottom as a closing element. Prioritize the main visual, let whitespace drive the placement, and weave information into the composition so it reads as one complete scene rather than assembled modules." data-name="留白驱动主视觉信息卡" data-name-zh="留白驱动主视觉信息卡" data-name-en="Whitespace-Driven Hero Information Card" aria-label="查看 SC-014 留白驱动主视觉信息卡"><img src="../../../images/layouts/social-cards/SC-014.webp" alt="SC-014 留白驱动主视觉信息卡"><span class="layout-info"><span class="layout-id">SC-014</span><span class="layout-name">留白驱动主视觉信息卡</span></span></button>
<button class="layout-card" type="button" data-id="SC-015" data-category="social-card" data-image="../../../images/layouts/social-cards/SC-015.webp" data-prompt="小红书社媒卡。整体采用上下两段式结构，将画面分成两个面积接近的独立内容区域，中间保留清晰间距或细分隔关系。两个区域使用统一的视觉语言和相近的内部结构，形成对照、前后、转折或递进关系。每个区域设置一个醒目的核心短句作为第一视觉层级，并安排一个尺寸明显较大的单一主视觉，与核心文字形成左右或斜向的非对称平衡；主视觉位置可根据留白和整体重心调整。核心文字与主视觉之外的剩余留白中，放置 2–4 行简短补充文字，不形成独立卡片或规则列表。上下两个区域保持相似的视觉重量和阅读节奏，但不要求完全镜像复制，可通过标题位置、主视觉方向或留白分布产生轻微变化；第二个区域可加入很短的过渡词、转折词或关系提示。整体强调“上下双区＋大短句＋单一主视觉＋少量补充说明”，避免复杂信息图、密集文字、规则宫格和过多装饰，保持大面积留白、层级清楚、手机端快速阅读。" data-prompt-zh="小红书社媒卡。整体采用上下两段式结构，将画面分成两个面积接近的独立内容区域，中间保留清晰间距或细分隔关系。两个区域使用统一的视觉语言和相近的内部结构，形成对照、前后、转折或递进关系。每个区域设置一个醒目的核心短句作为第一视觉层级，并安排一个尺寸明显较大的单一主视觉，与核心文字形成左右或斜向的非对称平衡；主视觉位置可根据留白和整体重心调整。核心文字与主视觉之外的剩余留白中，放置 2–4 行简短补充文字，不形成独立卡片或规则列表。上下两个区域保持相似的视觉重量和阅读节奏，但不要求完全镜像复制，可通过标题位置、主视觉方向或留白分布产生轻微变化；第二个区域可加入很短的过渡词、转折词或关系提示。整体强调“上下双区＋大短句＋单一主视觉＋少量补充说明”，避免复杂信息图、密集文字、规则宫格和过多装饰，保持大面积留白、层级清楚、手机端快速阅读。" data-prompt-en="Xiaohongshu social-media card. Use a two-section vertical structure with two similarly sized content areas separated by clear spacing or a subtle divider. Give both sections a consistent visual language and related internal structure so they express contrast, before-and-after, a turn, or progression. Each section begins with a prominent core short phrase as the first visual level and includes one clearly large primary visual, creating an asymmetrical horizontal or diagonal balance with the phrase; adjust the visual&#x27;s position according to whitespace and overall weight. Place concise two- to four-line supporting text in the remaining space, without making it a separate card or regular list. Keep the two sections similar in visual weight and reading rhythm without mirroring them exactly; vary the title position, visual direction, or whitespace distribution slightly. The second section may include a very short transition, contrast word, or relationship cue. Emphasize “two stacked sections + large short phrases + one primary visual per section + limited supporting copy.” Avoid complex infographics, dense text, regular grids, and excessive decoration; preserve generous negative space, clear hierarchy, and fast mobile reading." data-name="上下双区递进短句卡" data-name-zh="上下双区递进短句卡" data-name-en="Two-Tier Progressive Short-Phrase Card" aria-label="查看 SC-015 上下双区递进短句卡"><img src="../../../images/layouts/social-cards/SC-015.webp" alt="SC-015 上下双区递进短句卡"><span class="layout-info"><span class="layout-id">SC-015</span><span class="layout-name">上下双区递进短句卡</span></span></button>
<button class="layout-card" type="button" data-id="SC-016" data-category="social-card" data-image="../../../images/layouts/social-cards/SC-016.webp" data-prompt="小红书社媒卡。整体采用极简的大留白结构，以一组大字号短文案作为绝对视觉主体。主文案放置在画面上半部或中上部，占据主要横向宽度，可使用 2–3 行自然换行；文字整体偏左排列，但不紧贴边缘，形成稳定的大块文字区域。主文案字号明显大于其他元素，行距相对紧凑，个别关键词可通过颜色、字重、底纹或轻微标记进行局部强调，但不要让多个词同时抢夺注意力。主文案下方保留较大的空白距离，在中央或略偏一侧放置一个尺寸很小的视觉点缀，作为第二视觉停顿，不承担主要信息。画面四角可以加入极少量微型辅助信息，例如日期、页码、符号或装饰点，字号和视觉重量都非常低。整体不设置卡片框、分栏、信息列表或复杂图文组合，背景保持简洁，强调大文字、少元素、大留白、弱装饰，形成轻盈安静、适合快速阅读的社媒封面感。" data-prompt-zh="小红书社媒卡。整体采用极简的大留白结构，以一组大字号短文案作为绝对视觉主体。主文案放置在画面上半部或中上部，占据主要横向宽度，可使用 2–3 行自然换行；文字整体偏左排列，但不紧贴边缘，形成稳定的大块文字区域。主文案字号明显大于其他元素，行距相对紧凑，个别关键词可通过颜色、字重、底纹或轻微标记进行局部强调，但不要让多个词同时抢夺注意力。主文案下方保留较大的空白距离，在中央或略偏一侧放置一个尺寸很小的视觉点缀，作为第二视觉停顿，不承担主要信息。画面四角可以加入极少量微型辅助信息，例如日期、页码、符号或装饰点，字号和视觉重量都非常低。整体不设置卡片框、分栏、信息列表或复杂图文组合，背景保持简洁，强调大文字、少元素、大留白、弱装饰，形成轻盈安静、适合快速阅读的社媒封面感。" data-prompt-en="Xiaohongshu social-media card. Use an extremely minimal, spacious layout with a short piece of large typography as the absolute visual focus. Place the main copy in the upper or upper-middle area, spanning most of the available width and naturally wrapping across two or three lines. Align the text generally to the left without pressing it against the edge, creating a stable block. Make the main copy much larger than every other element with relatively tight line spacing. Emphasize only selected keywords through color, weight, a subtle background mark, or a light accent; do not let multiple words compete for attention. Leave generous space below the copy and place one very small visual accent in the center or slightly to one side as a secondary visual pause, without carrying primary information. The four corners may contain only a few tiny supporting details such as a date, page number, symbol, or decorative dot, all with very low visual weight. Do not use card frames, columns, information lists, or complex text-image combinations. Keep the background simple and emphasize large type, few elements, generous whitespace, and restrained decoration for a light, quiet, fast-to-read social cover." data-name="极简大字小图点缀卡" data-name-zh="极简大字小图点缀卡" data-name-en="Minimalist Big-Type Accent Card" aria-label="查看 SC-016 极简大字小图点缀卡"><img src="../../../images/layouts/social-cards/SC-016.webp" alt="SC-016 极简大字小图点缀卡"><span class="layout-info"><span class="layout-id">SC-016</span><span class="layout-name">极简大字小图点缀卡</span></span></button>
<button class="layout-card" type="button" data-id="SC-017" data-category="social-card" data-image="../../../images/layouts/social-cards/SC-017.webp" data-prompt="小红书社媒卡。排版：设置一个主标题，标签文字以自由、自然的方式分布在画面中，对画面里的角色、物件或场景元素做出简短注解，让文字参与整体构图。保留大面积留白，角色高度概括，减少装饰和复杂分区，保持构图简洁。" data-prompt-zh="小红书社媒卡。排版：设置一个主标题，标签文字以自由、自然的方式分布在画面中，对画面里的角色、物件或场景元素做出简短注解，让文字参与整体构图。保留大面积留白，角色高度概括，减少装饰和复杂分区，保持构图简洁。" data-prompt-en="Xiaohongshu social-media card. Layout: include a main headline, then distribute label text freely and naturally across the composition to provide brief annotations for the characters, objects, or scene elements. Let the text participate in the overall composition. Preserve generous negative space, use highly simplified characters, minimize decoration and complex sections, and keep the composition clean." data-name="自由标注留白信息卡" data-name-zh="自由标注留白信息卡" data-name-en="Freely Annotated Whitespace Card" aria-label="查看 SC-017 自由标注留白信息卡"><img src="../../../images/layouts/social-cards/SC-017.webp" alt="SC-017 自由标注留白信息卡"><span class="layout-info"><span class="layout-id">SC-017</span><span class="layout-name">自由标注留白信息卡</span></span></button>
<button class="layout-card" type="button" data-id="SC-018" data-category="social-card" data-image="../../../images/layouts/social-cards/SC-018.webp" data-prompt="小红书社媒卡。排版采用中心主视觉环绕式结构：顶部设置两级短标题，其中主标题醒目。画面中央放置一个占比最大的主体人物或物体，作为绝对视觉中心；主体四周分散安排 3–6 个尺寸较小的独立插图，每个小图旁仅配一个极短标签或事项名称。小图采用自由、不规则的环绕分布，左右和下方错落排布，保持视觉平衡而非整齐网格。背景保留大面积留白，主图、小图、文字之间保持明显间距，形成“一大主体＋多个小信息点”的层级关系。" data-prompt-zh="小红书社媒卡。排版采用中心主视觉环绕式结构：顶部设置两级短标题，其中主标题醒目。画面中央放置一个占比最大的主体人物或物体，作为绝对视觉中心；主体四周分散安排 3–6 个尺寸较小的独立插图，每个小图旁仅配一个极短标签或事项名称。小图采用自由、不规则的环绕分布，左右和下方错落排布，保持视觉平衡而非整齐网格。背景保留大面积留白，主图、小图、文字之间保持明显间距，形成“一大主体＋多个小信息点”的层级关系。" data-prompt-en="Xiaohongshu social-media card. Use a central-hero surrounding layout: place two levels of short headlines at the top, with the main headline prominent. Put one large person or object in the center as the absolute visual focus. Distribute 3–6 smaller independent illustrations around it, each accompanied by only an extremely short label or item name. Arrange the small illustrations freely and irregularly, staggered on the left, right, and below the hero rather than in a neat grid, while maintaining visual balance. Preserve generous negative space and clear gaps between the hero, small illustrations, and text to create a hierarchy of “one large subject plus multiple small information points.”" data-name="中心主视觉环绕信息卡" data-name-zh="中心主视觉环绕信息卡" data-name-en="Center Hero Surrounding Info Card" aria-label="查看 SC-018 中心主视觉环绕信息卡"><img src="../../../images/layouts/social-cards/SC-018.webp" alt="SC-018 中心主视觉环绕信息卡"><span class="layout-info"><span class="layout-id">SC-018</span><span class="layout-name">中心主视觉环绕信息卡</span></span></button>
<button class="layout-card" type="button" data-id="SC-019" data-category="social-card" data-image="../../../images/layouts/social-cards/SC-019.webp" data-prompt="小红书社媒卡。排版采用“顶部标题＋中央大人物＋左右零散标签”的三级结构。画面顶部放置一句醒目的短标题，字号最大，居中或略偏左。画面中央放置一个完整人物作为绝对视觉主体，人物占画面高度约 60%–75%，从中上部延伸到底部，保持完整轮廓。人物左右两侧分散安排 3–5 个极短标签，每个标签仅一行或短词组，并用简短细线、斜线或引导线指向人物附近对应位置。标签上下错落、自由分布，左右保持视觉平衡，不做成规则列表。人物与文字之间保留充足间距，不遮挡人物主体。背景大面积留白，不增加复杂图块、卡片框、表格或多余装饰，确保手机端一眼可读。" data-prompt-zh="小红书社媒卡。排版采用“顶部标题＋中央大人物＋左右零散标签”的三级结构。画面顶部放置一句醒目的短标题，字号最大，居中或略偏左。画面中央放置一个完整人物作为绝对视觉主体，人物占画面高度约 60%–75%，从中上部延伸到底部，保持完整轮廓。人物左右两侧分散安排 3–5 个极短标签，每个标签仅一行或短词组，并用简短细线、斜线或引导线指向人物附近对应位置。标签上下错落、自由分布，左右保持视觉平衡，不做成规则列表。人物与文字之间保留充足间距，不遮挡人物主体。背景大面积留白，不增加复杂图块、卡片框、表格或多余装饰，确保手机端一眼可读。" data-prompt-en="Xiaohongshu social-media card. Use a clear three-level structure of “top headline + large central person + scattered labels on both sides.” Place one prominent short headline at the top in the largest type, centered or slightly left-aligned. Put one complete person in the center as the absolute visual focus; the person should occupy about 60%–75% of the image height, extend from the upper-middle area toward the bottom, and retain a complete silhouette. Distribute 3–5 extremely short labels on both sides, each limited to one line or a short phrase, with brief thin lines, slashes, or leader lines pointing toward nearby parts of the person. Stagger and distribute the labels freely rather than as a regular list, while keeping left-right balance. Leave generous space between the person and text without covering the subject. Preserve a largely empty background and avoid complex graphic blocks, card frames, tables, or extra decoration for immediate mobile readability." data-name="中央人物细线标注卡" data-name-zh="中央人物细线标注卡" data-name-en="Central Character Leader-Line Card" aria-label="查看 SC-019 中央人物细线标注卡"><img src="../../../images/layouts/social-cards/SC-019.webp" alt="SC-019 中央人物细线标注卡"><span class="layout-info"><span class="layout-id">SC-019</span><span class="layout-name">中央人物细线标注卡</span></span></button>

arge visual block plus one concentrated small information cluster”: asymmetrical but stable, avoiding radial layouts, all-around placement, even distribution, or scattered elements across the whole canvas." data-name="一大一组非对称信息卡" data-name-zh="一大一组非对称信息卡" data-name-en="Asymmetric Hero &amp; Group Cluster Card" aria-label="查看 SC-020 一大一组非对称信息卡"><img src="../../../images/layouts/social-cards/SC-020.webp" alt="SC-020 一大一组非对称信息卡"><span class="layout-info"><span class="layout-id">SC-020</span><span class="layout-name">一大一组非对称信息卡</span></span></button>
<button class="layout-card" type="button" data-id="SC-021" data-category="social-card" data-image="../../../images/layouts/social-cards/SC-021.webp" data-prompt="小红书社媒卡。排版：自适应双拼照片艺术转译型。支持纯文本主题直出（由生图模型一体化生成）与上传照片垫图转绘。拼接时严禁修改或拉伸原图比例；完整画布由两块等大区域精准拼接：若为竖版原图采用左右 1:1 双拼横向并排，画布保持原图高度不变，总宽度精确为原图宽度的两倍（原图占左 50%，艺术转译区占右 50%）；若为横版原图/默认画幅采用上下 1:1 双拼纵向堆叠，画布保持原图宽度不变，总高度精确为原图高度的两倍（原图占上 50%，艺术转译区占下 50%）。由生图模型自主完成“真实摄影呈现 × 同一主体艺术风格转译”的前后虚实对照：

【真实摄影区（横版默认上方 / 竖版左侧）】：
由生图模型根据主题生成超写实、高质感的单反摄影真实照片（若用户上传了参考图则以其为准）。严格保持原图原始宽高比例与构图完整性，严禁拉伸变形或裁切。保持摄影真实景深、自然光线、真实皮肤/毛发质感与现场抓拍氛围，不做插画化重绘，作为风格转译前的真实摄影基准。

【艺术转译区（横版默认下方 / 竖版右侧）—— 彻底去写实与单义构图转译】：
1. 彻底去写实化与画风从零重绘（坚决杜绝照片套滤镜）：
艺术转译侧必须与摄影侧形成极具冲击力的跨媒介反差！坚决不要在原照片的写实五官与光影体积上直接套滤镜或贴材质。必须“只提取摄影区人物的五官标志特征、姿态神态与场景大轮廓”，在画风上完全按所选风格从零重绘为纯粹的 2D 手绘/艺术插画，让所选风格的笔触、线条、专属配色与质感辨识度最大化释放。

2. 坚决彻底剔除原片环境杂质（留白是第一原则，严禁照抄全景背景）：
严禁把摄影区的杂乱场景（如整面石墙、地面小路、大片树丛天空等）机械复制到转译区！转译侧画面四周边缘必须保留充足、干净的 40%–80% 负空间/呼吸留白底色（暖象牙白、米白棉麻纸纹），主体与文字向内部收拢，绝不贴边、绝不爆框。

3. 单一明确的构图转译语法与轮替机制（严格 Round-Robin 轮替，严禁千篇一律与多选平铺）：
若用户未显式指定构图，AI 提示词生成器（Prompter Agent）在每次生成时必须按顺序在以下五大核心玩法中进行严格轮替（Round-Robin 轮替抽卡，严禁连续输出同一玩法），并为选定的唯一玩法生成单义、排他的执行指令：
- 【玩法一：越界破框型】：在纯白底色中设置单枚低饱和几何色块/容器，主体大部分在色块内，但关键部位（头部/手部/枝叶）自然突破色块边缘伸出，形成空间穿透感；
- 【玩法二：微缩浮岛型】：主体大幅微缩为占画面 10%–25% 的精致纸面小景，仅由一抹清淡色带或基座承托，四周呈现大片静谧空旷留白；
- 【玩法三：记忆图谱平铺型】：打破单一场景，居中放置主体，并在留白中错落平铺 3–6 枚原图记忆特征贴纸（带 NO. 编号），间距透光；
- 【玩法四：经典悬浮落地型】：主体尺度适中（占 40%–55%），居中或微偏心站立，底部仅用一条极简地面摩擦线提示空间；
- 【玩法五：正负形咬合型】：主体高度提炼为几何剪影，与背景正负形相互转换咬合。

4. 编辑式微排版（文字优雅嵌入负空间）：
在空白负空间中巧妙排布 1–2 组与主题相关的精致微排版（手绘艺术标题、英文短句、编号标签或随笔小文案），字迹纤细克制。

- 【玩法五：正负形咬合型】：主体高度提炼为几何剪影，与背景正负形相互转换咬合。

4. 编辑式微排版（文字优雅嵌入负空间）：
在空白负空间中巧妙排布 1–2 组与主题相关的精致微排版（手绘艺术标题、英文短句、编号标签或随笔小文案），字迹纤细克制。

整体要求：拼接时严禁修改原图比例；加上艺术转译区后，整张图片宽度精确为原图宽度的两倍（左右双拼）或高度精确为原图高度的两倍（上下双拼）；双拼两区在中线处平齐无缝拼接，无多余边框；艺术转译侧四周确保留出充足负空间与呼吸边距；由生图模型自主完成“极致真实摄影 × 极致纯正手绘艺术”对比鲜明、四周留白舒展的高级艺术画报。" data-prompt-en="Xiaohongshu social-media card. Layout: Adaptive split photo-to-art translation layout. Supports both direct text-prompt generation (fully synthesized by the image generation model) and image-to-image photo translation. Strictly preserve the original photo&#x27;s native aspect ratio without stretching or distortion; the complete canvas is formed by seamlessly joining two equal halves: for portrait photos using a 1:1 side-by-side vertical split, the canvas maintains the photo&#x27;s original height with total width exactly twice (2×) the original photo&#x27;s width (source photo on left 50%, art panel on right 50%); for landscape photos / default using a 1:1 stacked horizontal split, the canvas maintains the photo&#x27;s original width with total height exactly twice (2×) the original photo&#x27;s height (source photo on upper 50%, art panel on lower 50%). The image generation model autonomously renders a cohesive before-and-after dialogue between &quot;Authentic Photography × Stylized Artwork&quot;:

[Authentic Photography Panel (Upper for Landscape / Left for Portrait)]:
The image model generates an ultra-realistic photograph matching the theme (or follows the uploaded photo if provided), strictly preserving the original aspect ratio and composition without stretching, distortion, or cropping. Maintains photographic depth of field, natural lighting, authentic skin/fur textures, and snapshot atmosphere without illustration redraws, establishing the realistic photographic baseline.

[Artistic Translation Panel (Lower for Landscape / Right for Portrait) — Radical De-Photorealism &amp; Singular Compositional Transfer]:
1. Radical De-Photorealism &amp; Style Redraw (Strictly NOT a Photo Filter):
The translated panel must form a dramatic cross-medium contrast with the photography panel! Strictly avoid slapping filters, grain, or shading onto the photo&#x27;s 3D anatomy. Extract only the subject&#x27;s iconic facial features, posture, and scene contours, redrawing them entirely from scratch in the chosen artistic style as pure 2D hand-drawn illustration with maximized stylistic linework, brushwork, and palette fidelity.

2. Strict Elimination of Environmental Clutter (Negative Space is Essential; Never Copy Full Background):
Strictly avoid duplicating the photographic background (e.g. full stone walls, pathways, dense trees, skies) into the translated panel! The translated panel MUST preserve generous, clean negative space and breathing margins (40%–80%) around all four outer edges on warm ivory/oatmeal paper ground. Hero subjects and typography must breathe inward, strictly never touching or bleeding over borders.

3. Singular Compositional Syntax &amp; Round-Robin Rotation Policy (Strict Round-Robin; Never Monotonous):
When the user does not explicitly specify a composition, the AI prompt generator MUST rotate through the 5 core playstyles in strict Round-Robin order (prohibiting consecutive repeats) and emit a singular, deterministic, exclusive instruction:
- [Playstyle 1: Boundary Break / Out-of-Bounds]: Subject is mostly framed inside a single geometric color block, with iconic parts (head, limbs, branches) naturally breaking out past the borders to create spatial penetration;
- [Playstyle 2: Miniature Diorama / Floating Island]: Subject is drastically scaled down to 10%–25% as a delicate paper-relief vignette resting on a gestural ribbon or pedestal, surrounded by vast serene negative space;
- [Playstyle 3: Memory Knolling / Fragment Collage]: Deconstructs single scenes; places the main subject alongside 3–6 deconstructed memory stickers/artifacts with NO. index tags and breathing gaps;
- [Playstyle 4: Classic Suspended / Grounded Hero]: Balanced scale (40%–55%), centered or slightly off-center, anchored solely by a single gestural ground friction line;
- [Playstyle 5: Gestalt Positive-Negative Interlock]: Highly stylized silhouette interlocked with background negative forms.

4. Editorial Micro-Typography in Negative Space:
Embed subtle editorial typography (hand-lettered artistic headline, delicate English phrases, edition/number tags, or poetic captions) within the open negative space.

Overall Requirement: Strictly preserve the original photograph&#x27;s aspect ratio without stretching; with the artistic translation panel added, the final canvas is exactly twice the width (side-by-side) or twice the height (stacked) of the original photo. The two split panels must join seamlessly at the midpoint with zero gaps or extra borders; the artistic translation panel must maintain generous negative space and breathing margins around all four outer edges, fully synthesized by the image generation model as an elegant, high-contrast visual dialogue between authentic photography and stylized artistic minimalism with generous perimeter breathing room." data-name="自适应双拼照片转译社媒卡" data-name-zh="自适应双拼照片转译社媒卡" data-name-en="Adaptive Split Photo-to-Art Social Card" aria-label="查看 SC-021 自适应双拼照片转译社媒卡"><img src="../../../images/layouts/social-cards/SC-021.webp" alt="SC-021 自适应双拼照片转译社媒卡"><span class="layout-info"><span class="layout-id">SC-021</span><span class="layout-name">自适应双拼照片转译社媒卡</span></span></button>

【画幅比例】：9:16

将输入的【中文姓名】制作成一张“姓名 → 四种签名方案”的竖版设计稿。

## 一、整体排版

画面比例为 9:16。

上方约占画面 40%，用于展示原始姓名。

下方约占画面 60%，用于展示同一个姓名的四种不同签名方案。

---

## 二、顶部姓名区

顶部使用【顶部背景色】。

顶部中央放置小字：

NAME TO SIGNATURE

画面中部展示【中文姓名】。

姓名必须使用普通印刷字体，不使用手写、连笔、签名字体或艺术变形，用于明确表示原始输入姓名。

中文姓名下方显示：

【姓名拼音】

姓名拼音使用大写英文字母。

顶部区域不添加其他文案、Logo、编号或图形。

---

## 三、底部签名区

底部划分为 2×2 四个区域。

使用细虚线进行横向和纵向分隔，不需要外边框。

四格分别展示同一个【中文姓名】的四种签名设计：

左上：飘逸
右上：锋势
左下：回环
右下：极简

每格只包含：

1. 一个大尺寸签名
2. 下方一个小字号风格名称

四个签名都必须来源于同一个【中文姓名】，但不能只是把完整姓名换四种相似写法。

允许对姓名进行：

省笔、合笔、连笔、共享笔画、压缩、拉长、缩写、拆解、重组、符号化。

不要求每一个中文字都完整可辨。

重点是保留姓名的部分结构特征，同时形成四种明显不同的签名骨架。

---

## 四、四种签名笔势

### 1. 飘逸

整体横向展开。

姓名高度压缩，多个字之间可以连续连写、共享笔画。

以连续曲线为主，笔势流畅。

可以使用一至两条跨度较大的长线，将整个签名串联起来。

允许出现较长的横向拖尾。

整体结构强调：

长线、曲线、连续、舒展、流动。

减少过多尖角和短促折线。

---

### 2. 锋势

整体具有明显向右推进的趋势。

大量使用：

斜线、尖角、高竖笔、快速切线、短促折笔。

姓名可以高度压缩，只保留主要骨架。

整体允许明显右倾。

主笔可以形成较强的上挑、下切、斜向穿插关系。

减少大面积圆形和柔软回环。

整体结构强调：

斜向、锐角、切线、速度、力量。

---

### 3. 回环

以一个或多个大型回环结构作为签名主体。

可以使用：

开放圆环、椭圆曲线、大型 S 曲线、连续回转线、包围结构。

将姓名压缩后的主要笔画嵌入回环内部，或让姓名笔画穿过回环。

最后一笔可以突破主体，形成较长收尾。

回环不能过于规则，应保留自然手写产生的不对称。

整体结构强调：

回旋、包围、穿插、连续曲线、大尺度手势。

---

### 4. 极简

不完整书写整个姓名。

从【中文姓名】中提取约 4–6 个最有识别价值的主要笔画，例如：

长横、主竖、折笔、斜线、撇捺、点笔。

重新组合成一个简化的个人签名标记。

允许大幅度省略原姓名结构。

整体笔画数量明显少于其他三款。

避免添加与姓名无关的装饰图形。

整体结构强调：

少笔画、大留白、强骨架、符号化。

---

## 五、四款差异控制

四种方案必须在以下方面产生明显区别：

- 笔画数量
- 横向或斜向趋势
- 曲线与直线比例
- 是否存在大型回环
- 是否完整保留姓名
- 重心位置
- 连笔方式
- 收尾方向
- 整体轮廓

四款不能只是修改同一个签名的尾笔。

应形成四种不同结构：

飘逸：长曲线 + 连续连写
锋势：斜线 + 尖角 + 强方向性
回环：大型曲线 + 包围结构
极简：少量核心笔画 + 高度符号化

最终只需要保留姓名、拼音、四个签名和四个风格名称，不添加其他内容。" data-prompt-zh="【中文姓名】：{例如：唐伯虎}

[Name Pinyin]: {e.g., TANG BOHU}
[Top Background Color]: {e.g., Deep Cobalt Blue}
[Aspect Ratio]: 9:16

Render the input [Chinese Name] into a vertical design presentation titled &quot;Name to Four Signature Concepts&quot;.

## 1. Overall Layout

Aspect ratio: 9:16 vertical poster layout.

The top ~40% of the canvas presents the original source name.

The bottom ~60% of the canvas presents four distinct signature design concepts created for the exact same name.

---

## 2. Top Name Header Area

The top section uses [Top Background Color].

Small header text centered near the very top:

NAME TO SIGNATURE

The center of the top section features [Chinese Name].

The name must strictly use clean, standard printed typography (serif or sans-serif)—no handwriting, cursive ligatures, artistic distortion, or signature fonts—to clearly establish the original baseline name.

Directly beneath the Chinese name, display:

[Name Pinyin]

The name pinyin must be rendered in clean uppercase Latin letters.

No additional copy, logos, numbers, or graphics in the top area.

---

## 3. Bottom Signature Grid Area

The bottom area is divided into a 2×2 four-quadrant grid.

Use thin, subtle dashed dividing lines horizontally and vertically; no outer framing border.

The four quadrants display four signature design concepts for the exact same [Chinese Name]:

Top-left: 飘逸 (Flowing / Elegant)
Top-right: 锋势 (Sharp / Dynamic)
Bottom-left: 回环 (Looping / Enclosing)
Bottom-right: 极简 (Minimalist / Symbolic)

Each quadrant contains strictly:
1. One prominent, large-scale signature design
2. One small-sized style name label underneath

All four signatures must be derived from the exact same [Chinese Name], but must never be mere slight variations of the same handwriting.

Permitted transformations on the name:
Stroke omission, stroke merging, cursive ligatures, shared strokes, compression, elongation, abbreviation, deconstruction, recombination, and symbolization.

It is NOT required for every Chinese character to remain fully legible.
The key objective is to preserve partial structural identity of the name while establishing four fundamentally distinct signature structural skeletons.

---

## 4. Four Signature Gestural Styles

### 1. 飘逸 (Flowing / Elegant)

Overall horizontal expansive posture.
The name characters are highly compressed and continuously joined with shared strokes across characters.
Dominated by fluid continuous curves with smooth gestural momentum.
May utilize one or two sweeping long strokes that unify the entire signature.
Allows an extended horizontal trailing flourish.
Structural emphasis:
Long strokes, fluid curves, continuous ligatures, expansive rhythm, dynamic flow.
Minimize sharp angles and abrupt hard turns.

---

### 2. 锋势 (Sharp / Dynamic)

Pronounced rightward thrust and forward momentum.
Heavily utilizes:
Diagonal slashes, acute angles, tall vertical strokes, rapid cutting strokes, and brisk geometric angular folds.
Name characters can be highly compressed, retaining only core skeleton strokes.
The entire signature may lean noticeably to the right.
Primary strokes form bold upward slashes, downward cuts, and diagonal interlocks.
Minimize large circular curves and soft loops.
Structural emphasis:
Diagonal thrust, acute angles, swift cutting lines, speed, and sharp tension.

---

### 3. 回环 (Looping / Enclosing)

Built around one or more large enclosing loops as the primary signature gesture.
May incorporate:
Open rings, elliptical loops, grand S-curves, continuous whirling lines, and protective surrounding structures.
The compressed primary strokes of the name are nestled inside the loops or pierced by the sweeping loop trajectory.
The final finishing stroke may break free of the main body with an expressive outward trail.
Loops must not look mechanically circular; preserve the organic asymmetry of natural swift calligraphy.
Structural emphasis:
Whirling loops, enclosure, penetration, continuous curves, large-scale gestures.

---

### 4. 极简 (Minimalist / Symbolic)

Does NOT write out the entire name.
Extracts only ~4–6 most recognizable structural strokes from [Chinese Name], such as:
A long horizontal bar, a dominant vertical, an angular fold, a swift diagonal, a slash/press stroke, or an anchor dot.
Recombines them into an ultra-clean, modernized personal signature mark / monogram.
Permits radical omission of conventional character anatomy.
Stroke count is drastically fewer than the other three concepts.
Avoid decorative geometric graphics unrelated to the name.
Structural emphasis:
Few strokes, generous breathing whitespace, bold essential skeleton, high symbolic abstraction.

---

## 5. Differentiation Control

The four concepts must exhibit striking, undeniable structural differences across:
- Stroke density and stroke count
- Horizontal vs. diagonal directional momentum
- Curve-to-straight line ratio
- Presence vs. absence of large enclosing loops
- Degree of name legibility vs. radical abbreviation
- Center of visual gravity
- Ligature connection logic
- Terminal flourish direction
- Overall silhouette profile

The four designs must not simply be one signature with four different tail endings.
They must establish four distinct structural philosophies:
Flowing: Long curves + continuous ligatures
Sharp: Diagonals + acute angles + decisive directional thrust
Looping: Monumental curves + enclosing loop architecture
Minimalist: Sparse core strokes + radical symbolic abstraction

Final image strictly retains only the name, pinyin, four signatures, and four style labels; no extraneous decorative elements." data-name="姓名四款签名设计展示卡" data-name-zh="姓名四款签名设计展示卡" data-name-en="Name-to-Four-Signature Showcase Card" aria-label="查看 SC-022 姓名四款签名设计展示卡"><img src="../../../images/layouts/social-cards/SC-022.webp" alt="SC-022 姓名四款签名设计展示卡"><span class="layout-info"><span class="layout-id">SC-022</span><span class="layout-name">姓名四款签名设计展示卡</span></span></button>
