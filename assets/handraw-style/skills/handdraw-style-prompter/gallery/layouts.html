<button class="layout-card" type="button" data-id="IG-002" data-category="infographic" data-image="../../../images/layouts/infographics/IG-002.webp" data-prompt="小红书信息图。排版：主图放在画面中央，周围环绕多个带线标签的注释，连接线分别指向主图的具体部位，对主体结构或细节进行清晰标注说明。" data-prompt-zh="小红书信息图。排版：主图放在画面中央，周围环绕多个带线标签的注释，连接线分别指向主图的具体部位，对主体结构或细节进行清晰标注说明。" data-prompt-en="Xiaohongshu infographic. Layout: place the main illustration in the center, surround it with multiple labeled annotations connected by leader lines, and point each line to a specific part of the subject for clear structural or detail explanations." data-name="中心主图标注信息图" data-name-zh="中心主图标注信息图" data-name-en="Central Hero Callout Infographic" aria-label="查看 IG-002 中心主图标注信息图"><img src="../../../images/layouts/infographics/IG-002.webp" alt="IG-002 中心主图标注信息图"><span class="layout-info"><span class="layout-id">IG-002</span><span class="layout-name">中心主图标注信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-003" data-category="infographic" data-image="../../../images/layouts/infographics/IG-003.webp" data-prompt="小红书信息图。高泛用性多层/多行图文并列结构。排版：顶部设置醒目的主标题区（可包含主标题、副标题、日期/标签或分类标语）；主体由多行（通常 3–5 层）垂直等距对齐的横向模块组成，每一行采用左侧文字信息（时间点/小标题/标签与要点说明）、右侧对应配图（场景插图/实物/产品图）的并列结构，各行保持整齐统一的水平对齐；底部可配置总结提示、实用贴士备忘或简短结语。该版式通用于各类横向分层条目展示，包括但不限于每日行程路线安排、图鉴速览、分类清单、步骤流程、多维度对照或对比等场景。" data-prompt-zh="小红书信息图。高泛用性多层/多行图文并列结构。排版：顶部设置醒目的主标题区（可包含主标题、副标题、日期/标签或分类标语）；主体由多行（通常 3–5 层）垂直等距对齐的横向模块组成，每一行采用左侧文字信息（时间点/小标题/标签与要点说明）、右侧对应配图（场景插图/实物/产品图）的并列结构，各行保持整齐统一的水平对齐；底部可配置总结提示、实用贴士备忘或简短结语。该版式通用于各类横向分层条目展示，包括但不限于每日行程路线安排、图鉴速览、分类清单、步骤流程、多维度对照或对比等场景。" data-prompt-en="Xiaohongshu infographic. Highly versatile multi-row text-and-image structure. Layout: place a prominent headline area at the top (can include main title, subtitle, date/tag, or category slogan). The main body consists of multiple vertically stacked, uniformly spaced item rows (typically 3–5 tiers). Each row uses a consistent side-by-side structure with text information on the left (timestamp, subhead, tags, descriptive bullets) and the corresponding illustration or photo on the right, maintaining neat horizontal alignment across all rows. The bottom section can include summary notes, practical tips, or a brief closing remark. This layout is broadly versatile, seamlessly supporting daily travel itineraries, timeline routes, catalog overviews, curated lists, step-by-step processes, as well as multi-item comparisons." data-name="多行左文右图信息图" data-name-zh="多行左文右图信息图" data-name-en="Multi-Row Left-Text Right-Image Infographic" aria-label="查看 IG-003 多行左文右图信息图"><img src="../../../images/layouts/infographics/IG-003.webp" alt="IG-003 多行左文右图信息图"><span class="layout-info"><span class="layout-id">IG-003</span><span class="layout-name">多行左文右图信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-004" data-category="infographic" data-image="../../../images/layouts/infographics/IG-004.webp" data-prompt="小红书信息图。排版：顶部设置主标题，主体分为左右两列进行对比，每列内部包含多行对应内容；保持两列结构清晰、行项相互对齐，突出不同对象之间的逐项比较关系。" data-prompt-zh="小红书信息图。排版：顶部设置主标题，主体分为左右两列进行对比，每列内部包含多行对应内容；保持两列结构清晰、行项相互对齐，突出不同对象之间的逐项比较关系。" data-prompt-en="Xiaohongshu infographic. Layout: place a main headline at the top, then organize the comparison into two side-by-side columns. Each column contains multiple corresponding rows; keep the columns clear and the rows aligned to emphasize item-by-item differences between the two subjects." data-name="双列多行对比信息图" data-name-zh="双列多行对比信息图" data-name-en="Two-Column Multi-Row Comparison" aria-label="查看 IG-004 双列多行对比信息图"><img src="../../../images/layouts/infographics/IG-004.webp" alt="IG-004 双列多行对比信息图"><span class="layout-info"><span class="layout-id">IG-004</span><span class="layout-name">双列多行对比信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-005" data-category="infographic" data-image="../../../images/layouts/infographics/IG-005.webp" data-prompt="小红书信息图。整体采用“顶部超大标题＋中部大型结构主视觉＋下部图鉴式分类单元”的纵向结构。顶部设置一行醒目的大标题，字号明显大于其他文字，横向展开，占据独立标题区，并与下方内容保持清晰间距。画面中部放置一个尺寸很大的完整主视觉，占据画面主要宽度，作为整张卡片的核心；主视觉内部可根据自身结构划分若干区域，并直接嵌入简短标签，使文字与主视觉形成一体化标注，不拆成多个独立卡片。画面下部排列多个尺寸较小的独立视觉单元，采用规则但不过分拥挤的多列布局，每个单元由“小视觉＋下方短标签”组成，尺寸尽量统一，横向和纵向间距稳定，形成图鉴、目录或分类展示的扫描节奏。小单元数量可以较多，但必须明显小于中部主视觉，不使用复杂卡片框，依靠留白、对齐和重复结构建立秩序。整体阅读顺序为顶部标题→中部整体结构→下部细分类单元，避免左右分栏、复杂装饰和不规则拼贴。" data-prompt-zh="小红书信息图。整体采用“顶部超大标题＋中部大型结构主视觉＋下部图鉴式分类单元”的纵向结构。顶部设置一行醒目的大标题，字号明显大于其他文字，横向展开，占据独立标题区，并与下方内容保持清晰间距。画面中部放置一个尺寸很大的完整主视觉，占据画面主要宽度，作为整张卡片的核心；主视觉内部可根据自身结构划分若干区域，并直接嵌入简短标签，使文字与主视觉形成一体化标注，不拆成多个独立卡片。画面下部排列多个尺寸较小的独立视觉单元，采用规则但不过分拥挤的多列布局，每个单元由“小视觉＋下方短标签”组成，尺寸尽量统一，横向和纵向间距稳定，形成图鉴、目录或分类展示的扫描节奏。小单元数量可以较多，但必须明显小于中部主视觉，不使用复杂卡片框，依靠留白、对齐和重复结构建立秩序。整体阅读顺序为顶部标题→中部整体结构→下部细分类单元，避免左右分栏、复杂装饰和不规则拼贴。" data-prompt-en="Xiaohongshu infographic. Use a vertical structure of “oversized headline at the top + large structural hero visual in the middle + catalog-like classification units at the bottom.” Place one prominent headline across a dedicated top title area, clearly larger than all other text, with clear spacing before the content below. Place one large, complete hero visual across most of the middle area as the core of the card; the hero visual may contain several internal regions and short labels embedded directly within it, integrating text with the visual instead of adding external callouts. Arrange multiple smaller independent visual units below in a regular but breathable multi-column layout. Each unit consists of a small visual with a short label underneath; keep sizes consistent and horizontal and vertical spacing stable to create the scanning rhythm of an atlas, directory, or category display. The smaller units may be numerous but must remain clearly subordinate to the central hero visual. Avoid complex card frames and establish order through whitespace, alignment, and repeated structure. The reading order is top headline → central whole structure → lower detailed categories; avoid side-by-side columns, excessive decoration, and irregular collage." data-name="大主视觉下方图鉴信息图" data-name-zh="大主视觉下方图鉴信息图" data-name-en="Hero Visual Catalog Infographic" aria-label="查看 IG-005 大主视觉下方图鉴信息图"><img src="../../../images/layouts/infographics/IG-005.webp" alt="IG-005 大主视觉下方图鉴信息图"><span class="layout-info"><span class="layout-id">IG-005</span><span class="layout-name">大主视觉下方图鉴信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-006" data-category="infographic" data-image="../../../images/layouts/infographics/IG-006.webp" data-prompt="小红书信息图。排版：设置一个主标题，主体由多个层级组成，每一层左侧放置该层标题，右侧整齐排列多个带文字标签的图标，用于呈现不同层级之间的对比关系。使用纯色背景，保留较多留白空间，整体构图简单。" data-prompt-zh="小红书信息图。排版：设置一个主标题，主体由多个层级组成，每一层左侧放置该层标题，右侧整齐排列多个带文字标签的图标，用于呈现不同层级之间的对比关系。使用纯色背景，保留较多留白空间，整体构图简单。" data-prompt-en="Xiaohongshu infographic. Layout: include a main headline, then organize the body into multiple tiers. Place the tier title on the left of each tier and arrange multiple labeled icons neatly on the right to present comparisons between levels. Use a solid-color background, generous negative space, and a simple overall composition." data-name="多层标题图标对比信息图" data-name-zh="多层标题图标对比信息图" data-name-en="Multi-Tier Headline Icon Comparison" aria-label="查看 IG-006 多层标题图标对比信息图"><img src="../../../images/layouts/infographics/IG-006.webp" alt="IG-006 多层标题图标对比信息图"><span class="layout-info"><span class="layout-id">IG-006</span><span class="layout-name">多层标题图标对比信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-007" data-category="infographic" data-image="../../../images/layouts/infographics/IG-007.webp" data-prompt="小红书信息图。排版：粗体标题，多行带标签小图，底部一行字，纯色背景，无框，较多留白空间。" data-prompt-zh="小红书信息图。排版：粗体标题，多行带标签小图，底部一行字，纯色背景，无框，较多留白空间。" data-prompt-en="Xiaohongshu infographic. Layout: bold headline, multiple small labeled illustrations, one short line at the bottom, solid-color background, no frame, and generous negative space." data-name="粗体标题标签小图卡" data-name-zh="粗体标题标签小图卡" data-name-en="Bold Headline Tag Cards" aria-label="查看 IG-007 粗体标题标签小图卡"><img src="../../../images/layouts/infographics/IG-007.webp" alt="IG-007 粗体标题标签小图卡"><span class="layout-info"><span class="layout-id">IG-007</span><span class="layout-name">粗体标题标签小图卡</span></span></button>
<button class="layout-card" type="button" data-id="IG-008" data-category="infographic" data-image="../../../images/layouts/infographics/IG-008.webp" data-prompt="小红书信息图。排版：设置一个主标题，主体采用流程步骤图结构，步骤路径可以是横向、纵向、S 形或其他清晰的路径式布局。每一步只包含一个小图和一句简短说明，步骤之间通过方向、顺序或适度引导关系连接。保留大面积留白，避免复杂装饰和过多文字。" data-prompt-zh="小红书信息图。排版：设置一个主标题，主体采用流程步骤图结构，步骤路径可以是横向、纵向、S 形或其他清晰的路径式布局。每一步只包含一个小图和一句简短说明，步骤之间通过方向、顺序或适度引导关系连接。保留大面积留白，避免复杂装饰和过多文字。" data-prompt-en="Xiaohongshu infographic. Layout: include a main headline and build the body as a process-step diagram. The sequence may use a horizontal, vertical, S-shaped, or another clearly readable path layout. Each step contains only one small illustration and one concise sentence, connected through direction, order, or light guidance. Preserve generous negative space and avoid complex decoration or excessive text." data-name="多路径流程步骤图" data-name-zh="多路径流程步骤图" data-name-en="Multi-Path Process Step Flow" aria-label="查看 IG-008 多路径流程步骤图"><img src="../../../images/layouts/infographics/IG-008.webp" alt="IG-008 多路径流程步骤图"><span class="layout-info"><span class="layout-id">IG-008</span><span class="layout-name">多路径流程步骤图</span></span></button>
<button class="layout-card" type="button" data-id="IG-009" data-category="infographic" data-image="../../../images/layouts/infographics/IG-009.webp" data-prompt="小红书信息图。排版：设置一个主标题，主体采用时间轴型结构，用一条清晰的主轴串联多个节点。时间轴可以横向或纵向展开，每个节点包含一个小图、一个时间信息和一句简短说明。保持节点顺序清楚、层级明确，并保留大面积留白，避免复杂装饰和过多文字。" data-prompt-zh="小红书信息图。排版：设置一个主标题，主体采用时间轴型结构，用一条清晰的主轴串联多个节点。时间轴可以横向或纵向展开，每个节点包含一个小图、一个时间信息和一句简短说明。保持节点顺序清楚、层级明确，并保留大面积留白，避免复杂装饰和过多文字。" data-prompt-en="Xiaohongshu infographic. Layout: include a main headline and build the body as a timeline, with one clear main axis connecting multiple nodes. The timeline may run horizontally or vertically. Each node contains one small illustration, a time marker, and one concise sentence. Keep the sequence clear and the hierarchy legible, preserve generous negative space, and avoid complex decoration or excessive text." data-name="时间轴节点信息图" data-name-zh="时间轴节点信息图" data-name-en="Timeline Milestone Infographic" aria-label="查看 IG-009 时间轴节点信息图"><img src="../../../images/layouts/infographics/IG-009.webp" alt="IG-009 时间轴节点信息图"><span class="layout-info"><span class="layout-id">IG-009</span><span class="layout-name">时间轴节点信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-010" data-category="infographic" data-image="../../../images/layouts/infographics/IG-010.webp" data-prompt="小红书信息图。排版：阶段进阶型，重点展示由低到高的等级变化和阶段提升，不以时间先后为组织依据。顶部设置简短醒目的主标题，主体可采用阶梯、上升箭头或清晰的层级结构，使进阶方向一目了然。各阶段配简洁小图、等级名称和简短说明，层级关系清楚，文字从简。保留大面积留白和舒适的阶段间距，构图简洁。" data-prompt-zh="小红书信息图。排版：阶段进阶型，重点展示由低到高的等级变化和阶段提升，不以时间先后为组织依据。顶部设置简短醒目的主标题，主体可采用阶梯、上升箭头或清晰的层级结构，使进阶方向一目了然。各阶段配简洁小图、等级名称和简短说明，层级关系清楚，文字从简。保留大面积留白和舒适的阶段间距，构图简洁。" data-prompt-en="Xiaohongshu infographic. Layout: stage progression, emphasizing changes in level and advancement from lower to higher stages rather than chronological order. Place a short, prominent headline at the top. Use stairs, an ascending arrow, or a clear hierarchical structure to make the direction of progression immediately readable. Pair each stage with a simple small illustration, a level name, and a brief description. Keep the hierarchy clear and the wording concise. Preserve generous negative space, comfortable spacing between stages, and a simple composition." data-name="阶段等级进阶信息图" data-name-zh="阶段等级进阶信息图" data-name-en="Stage Progression Infographic" aria-label="查看 IG-010 阶段等级进阶信息图"><img src="../../../images/layouts/infographics/IG-010.webp" alt="IG-010 阶段等级进阶信息图"><span class="layout-info"><span class="layout-id">IG-010</span><span class="layout-name">阶段等级进阶信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-011" data-category="infographic" data-image="../../../images/layouts/infographics/IG-011.webp" data-prompt="小红书信息图。排版：Before / After 型，前后变化是绝对视觉重点。将画面组织为前后两个主要区域，可以左右排列，也可以上下排列；两部分之间只放箭头、日期或极少量说明，用来表达变化方向。Before 与 After 各自呈现完整、可直接比较的主视觉，标签和文字保持简洁。保留大面积留白，避免复杂装饰和过多辅助信息。" data-prompt-zh="小红书信息图。排版：Before / After 型，前后变化是绝对视觉重点。将画面组织为前后两个主要区域，可以左右排列，也可以上下排列；两部分之间只放箭头、日期或极少量说明，用来表达变化方向。Before 与 After 各自呈现完整、可直接比较的主视觉，标签和文字保持简洁。保留大面积留白，避免复杂装饰和过多辅助信息。" data-prompt-en="Xiaohongshu infographic. Layout: Before / After comparison, with the change between the two states as the absolute visual focus. Organize the composition into two primary areas, arranged either side by side or one above the other. Place only an arrow, a date, or very limited explanatory text between them to show the direction of change. Give both Before and After a complete main visual that can be compared directly, and keep labels and wording concise. Preserve generous negative space and avoid complex decoration or excessive supporting information." data-name="前后变化对比信息图" data-name-zh="前后变化对比信息图" data-name-en="Before &amp; After Comparison Infographic" aria-label="查看 IG-011 前后变化对比信息图"><img src="../../../images/layouts/infographics/IG-011.webp" alt="IG-011 前后变化对比信息图"><span class="layout-info"><span class="layout-id">IG-011</span><span class="layout-name">前后变化对比信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-012" data-category="infographic" data-image="../../../images/layouts/infographics/IG-012.webp" data-prompt="小红书信息图。排版：分层结构型，围绕天然存在的层级关系组织信息，可以表现为上中下、内中外、表层深层或由基础到核心的多层结构。设置清晰的主标题，主体通过层层嵌套、上下分层或由下至上的结构展示不同层级；每一层配简洁名称、短句或小图，保持层级顺序和阅读关系明确。保留大面积留白，避免复杂装饰、过密文字和无关模块。" data-prompt-zh="小红书信息图。排版：分层结构型，围绕天然存在的层级关系组织信息，可以表现为上中下、内中外、表层深层或由基础到核心的多层结构。设置清晰的主标题，主体通过层层嵌套、上下分层或由下至上的结构展示不同层级；每一层配简洁名称、短句或小图，保持层级顺序和阅读关系明确。保留大面积留白，避免复杂装饰、过密文字和无关模块。" data-prompt-en="Xiaohongshu infographic. Layout: layered structure, organizing information around an inherent hierarchy such as top-middle-bottom, inner-middle-outer, surface-deep, or a multi-level structure from foundation to core. Include a clear main headline. Use nested layers, stacked sections, or a bottom-to-top structure to present the hierarchy; each layer may include a concise name, short sentence, or small illustration. Keep the order and reading relationship clear, preserve generous negative space, and avoid complex decoration, dense text, or unrelated modules." data-name="分层结构型信息图" data-name-zh="分层结构型信息图" data-name-en="Layered Hierarchy Infographic" aria-label="查看 IG-012 分层结构型信息图"><img src="../../../images/layouts/infographics/IG-012.webp" alt="IG-012 分层结构型信息图"><span class="layout-info"><span class="layout-id">IG-012</span><span class="layout-name">分层结构型信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-013" data-category="infographic" data-image="../../../images/layouts/infographics/IG-013.webp" data-prompt="小红书信息图。排版：漏斗型，上宽下窄，通过逐层收窄的结构展示从广泛进入、筛选、转化、淘汰到聚焦沉淀的过程。设置清晰的主标题，漏斗各层配简洁的阶段名称、短句或小图，突出人数、对象或范围逐步减少而重点逐步集中的关系。层级顺序应清楚，保留大面积留白，避免复杂装饰和过多文字。" data-prompt-zh="小红书信息图。排版：漏斗型，上宽下窄，通过逐层收窄的结构展示从广泛进入、筛选、转化、淘汰到聚焦沉淀的过程。设置清晰的主标题，漏斗各层配简洁的阶段名称、短句或小图，突出人数、对象或范围逐步减少而重点逐步集中的关系。层级顺序应清楚，保留大面积留白，避免复杂装饰和过多文字。" data-prompt-en="Xiaohongshu infographic. Layout: funnel-shaped, wide at the top and narrow at the bottom, using progressively narrowing layers to show a process from broad entry, filtering, and conversion to elimination and focused retention. Include a clear main headline. Give each funnel layer a concise stage name, short sentence, or small illustration, emphasizing that the people, objects, or scope become smaller while the focus becomes stronger. Keep the hierarchy clear, preserve generous negative space, and avoid complex decoration or excessive text." data-name="漏斗转化型信息图" data-name-zh="漏斗转化型信息图" data-name-en="Conversion Funnel Infographic" aria-label="查看 IG-013 漏斗转化型信息图"><img src="../../../images/layouts/infographics/IG-013.webp" alt="IG-013 漏斗转化型信息图"><span class="layout-info"><span class="layout-id">IG-013</span><span class="layout-name">漏斗转化型信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-014" data-category="infographic" data-image="../../../images/layouts/infographics/IG-014.webp" data-prompt="小红书信息图。排版：矩阵型，以两条相互垂直的轴将内容划分为四个象限，优先采用清晰易读的 2×2 结构。设置一个主标题，并明确标注横轴、纵轴及其两端含义；每个象限放置一个主题单元，可包含简短标题、小图和少量说明。四个区域保持对齐、间距均衡和比较关系明确，保留大面积留白，避免复杂装饰和过多文字。" data-prompt-zh="小红书信息图。排版：矩阵型，以两条相互垂直的轴将内容划分为四个象限，优先采用清晰易读的 2×2 结构。设置一个主标题，并明确标注横轴、纵轴及其两端含义；每个象限放置一个主题单元，可包含简短标题、小图和少量说明。四个区域保持对齐、间距均衡和比较关系明确，保留大面积留白，避免复杂装饰和过多文字。" data-prompt-en="Xiaohongshu infographic. Layout: matrix type, using two perpendicular axes to divide the content into four quadrants, preferably as a clear and readable 2×2 structure. Include a main headline and label the horizontal axis, vertical axis, and the meaning of both ends. Place one thematic unit in each quadrant, with a concise title, small illustration, and limited explanation. Keep the four areas aligned, evenly spaced, and easy to compare. Preserve generous negative space and avoid complex decoration or excessive text." data-name="四象限矩阵信息图" data-name-zh="四象限矩阵信息图" data-name-en="Four-Quadrant Matrix Infographic" aria-label="查看 IG-014 四象限矩阵信息图"><img src="../../../images/layouts/infographics/IG-014.webp" alt="IG-014 四象限矩阵信息图"><span class="layout-info"><span class="layout-id">IG-014</span><span class="layout-name">四象限矩阵信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-015" data-category="infographic" data-image="../../../images/layouts/infographics/IG-015.webp" data-prompt="小红书信息图。排版：坐标散点型，在一个清晰的坐标空间中散布多个不同对象，通过它们在横轴和纵轴上的位置表达分类、倾向或关系。设置一个主标题，明确标注横轴、纵轴及两端含义；每个对象由简洁的小图、名称和少量说明组成，位置分布应有辨识度并便于比较。保留坐标区域周围的大面积留白，避免复杂装饰和过多文字。" data-prompt-zh="小红书信息图。排版：坐标散点型，在一个清晰的坐标空间中散布多个不同对象，通过它们在横轴和纵轴上的位置表达分类、倾向或关系。设置一个主标题，明确标注横轴、纵轴及两端含义；每个对象由简洁的小图、名称和少量说明组成，位置分布应有辨识度并便于比较。保留坐标区域周围的大面积留白，避免复杂装饰和过多文字。" data-prompt-en="Xiaohongshu infographic. Layout: coordinate scatter type, placing multiple different objects within a clear coordinate space and using their positions along the horizontal and vertical axes to express categories, tendencies, or relationships. Include a main headline and clearly label both axes and the meaning of their ends. Represent each object with a simple small illustration, name, and limited explanation; make the positions distinctive and easy to compare. Preserve generous negative space around the coordinate area and avoid complex decoration or excessive text." data-name="坐标散点型信息图" data-name-zh="坐标散点型信息图" data-name-en="Coordinate Scatter Plot Infographic" aria-label="查看 IG-015 坐标散点型信息图"><img src="../../../images/layouts/infographics/IG-015.webp" alt="IG-015 坐标散点型信息图"><span class="layout-info"><span class="layout-id">IG-015</span><span class="layout-name">坐标散点型信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-016" data-category="infographic" data-image="../../../images/layouts/infographics/IG-016.webp" data-prompt="小红书信息图。排版：分类树 / 树状型，从一个核心大类或根节点开始，向下分成若干主要小类，再继续分解为更细的子类或末端节点。设置清晰的主标题，根节点位于顶部或中心上方，各级节点通过连线体现所属关系和分支路径。每个节点使用简短名称或极少说明，层级深度、分支顺序和阅读路径必须清楚。保留适度留白，避免过度装饰和无关信息。" data-prompt-zh="小红书信息图。排版：分类树 / 树状型，从一个核心大类或根节点开始，向下分成若干主要小类，再继续分解为更细的子类或末端节点。设置清晰的主标题，根节点位于顶部或中心上方，各级节点通过连线体现所属关系和分支路径。每个节点使用简短名称或极少说明，层级深度、分支顺序和阅读路径必须清楚。保留适度留白，避免过度装饰和无关信息。" data-prompt-en="Xiaohongshu infographic. Layout: category tree or hierarchy tree, beginning with one core category or root node and branching downward into several major subcategories, then continuing into more detailed child or terminal nodes. Include a clear main headline. Place the root at the top or upper center, and use connecting lines to show parent-child relationships and branch paths. Give each node a concise name or minimal explanation; the hierarchy depth, branch order, and reading path must remain clear. Keep appropriate negative space and avoid excessive decoration or unrelated information." data-name="分类树状型信息图" data-name-zh="分类树状型信息图" data-name-en="Categorical Tree Hierarchy Infographic" aria-label="查看 IG-016 分类树状型信息图"><img src="../../../images/layouts/infographics/IG-016.webp" alt="IG-016 分类树状型信息图"><span class="layout-info"><span class="layout-id">IG-016</span><span class="layout-name">分类树状型信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-017" data-category="infographic" data-image="../../../images/layouts/infographics/IG-017.webp" data-prompt="小红书信息图。排版：思维导图型，中心主题作为核心节点，向外延伸多条分支；每条分支包含若干短标签或小图标，清楚表达从中心到子主题的层级关系。避免规则表格和过密文字，使用自然弯曲的连线、适度留白和简洁角色概括形成清晰阅读路径。" data-prompt-zh="小红书信息图。排版：思维导图型，中心主题作为核心节点，向外延伸多条分支；每条分支包含若干短标签或小图标，清楚表达从中心到子主题的层级关系。避免规则表格和过密文字，使用自然弯曲的连线、适度留白和简洁角色概括形成清晰阅读路径。" data-prompt-en="Xiaohongshu infographic. Layout: mind-map type, with one central topic as the core node and multiple branches extending outward. Each branch contains concise labels or small icons, clearly expressing the hierarchy from the center to subtopics. Avoid rigid tables and dense text; use natural curved connectors, generous negative space, and simplified characters to create a clear reading path." data-name="思维导图型信息图" data-name-zh="思维导图型信息图" data-name-en="Mind Map Radial Infographic" aria-label="查看 IG-017 思维导图型信息图"><img src="../../../images/layouts/infographics/IG-017.webp" alt="IG-017 思维导图型信息图"><span class="layout-info"><span class="layout-id">IG-017</span><span class="layout-name">思维导图型信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-018" data-category="infographic" data-image="../../../images/layouts/infographics/IG-018.webp" data-prompt="小红书信息图。排版：关系网络型，多个对象分布在画面中，用不同颜色或粗细的连线表达合作、影响、依赖或关联关系。可以只有弱中心，不要求所有节点平均分布；节点名称保持简短，整体留白充足，避免复杂表格和密集说明。" data-prompt-zh="小红书信息图。排版：关系网络型，多个对象分布在画面中，用不同颜色或粗细的连线表达合作、影响、依赖或关联关系。可以只有弱中心，不要求所有节点平均分布；节点名称保持简短，整体留白充足，避免复杂表格和密集说明。" data-prompt-en="Xiaohongshu infographic. Layout: relationship network, with multiple objects distributed across the canvas and connectors of varied color or weight showing collaboration, influence, dependency, or association. A weak center is acceptable and nodes do not need to be evenly distributed. Keep labels concise, preserve generous negative space, and avoid dense tables or explanations." data-name="关系网络型信息图" data-name-zh="关系网络型信息图" data-name-en="Relationship Network Infographic" aria-label="查看 IG-018 关系网络型信息图"><img src="../../../images/layouts/infographics/IG-018.webp" alt="IG-018 关系网络型信息图"><span class="layout-info"><span class="layout-id">IG-018</span><span class="layout-name">关系网络型信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-019" data-category="infographic" data-image="../../../images/layouts/infographics/IG-019.webp" data-prompt="小红书信息图。排版：循环闭环型，多个阶段围成圆形或环形路径，用连续箭头串联，强调持续循环、反馈和迭代，而不是开始到结束的单向流程。中心保留标题或核心结论，节点配小图和短句，留白清楚，避免拥挤。" data-prompt-zh="小红书信息图。排版：循环闭环型，多个阶段围成圆形或环形路径，用连续箭头串联，强调持续循环、反馈和迭代，而不是开始到结束的单向流程。中心保留标题或核心结论，节点配小图和短句，留白清楚，避免拥挤。" data-prompt-en="Xiaohongshu infographic. Layout: closed-loop cycle, with several stages arranged in a circular path and connected by continuous arrows. Emphasize repetition, feedback, and iteration rather than a one-way beginning-to-end process. Keep a title or key conclusion in the center, pair nodes with small visuals and short phrases, and preserve clear negative space." data-name="循环闭环型信息图" data-name-zh="循环闭环型信息图" data-name-en="Closed-Loop Cycle Infographic" aria-label="查看 IG-019 循环闭环型信息图"><img src="../../../images/layouts/infographics/IG-019.webp" alt="IG-019 循环闭环型信息图"><span class="layout-info"><span class="layout-id">IG-019</span><span class="layout-name">循环闭环型信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-020" data-category="infographic" data-image="../../../images/layouts/infographics/IG-020.webp" data-prompt="小红书信息图。排版：路径地图型，一条弯曲、蜿蜒或游戏地图式路线贯穿画面，沿途安排多个编号节点、地点或阶段。每个节点配一个小视觉和一句短说明，用箭头、虚线或路标表达探索方向；不必是真实地图，重点是路径和节点关系，保留大面积留白。" data-prompt-zh="小红书信息图。排版：路径地图型，一条弯曲、蜿蜒或游戏地图式路线贯穿画面，沿途安排多个编号节点、地点或阶段。每个节点配一个小视觉和一句短说明，用箭头、虚线或路标表达探索方向；不必是真实地图，重点是路径和节点关系，保留大面积留白。" data-prompt-en="Xiaohongshu infographic. Layout: path-map type, with one winding or game-map-like route crossing the canvas and several numbered nodes, locations, or stages along it. Pair each node with a small visual and one short explanation, using arrows, dashed lines, or signposts to show direction. It does not need to be a real map; emphasize the route and node relationships while preserving generous negative space." data-name="路径地图型信息图" data-name-zh="路径地图型信息图" data-name-en="Narrative Route Map Infographic" aria-label="查看 IG-020 路径地图型信息图"><img src="../../../images/layouts/infographics/IG-020.webp" alt="IG-020 路径地图型信息图"><span class="layout-info"><span class="layout-id">IG-020</span><span class="layout-name">路径地图型信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-021" data-category="infographic" data-image="../../../images/layouts/infographics/IG-021.webp" data-prompt="小红书信息图。排版：真实地图与标注型，以真实地图轮廓、街区、水系或区域关系作为主视觉，在地图上放置地点标记、极短说明和少量小图标。标注需避开主体遮挡，层级清楚，图例简洁，避免把地图做成密集列表。" data-prompt-zh="小红书信息图。排版：真实地图与标注型，以真实地图轮廓、街区、水系或区域关系作为主视觉，在地图上放置地点标记、极短说明和少量小图标。标注需避开主体遮挡，层级清楚，图例简洁，避免把地图做成密集列表。" data-prompt-en="Xiaohongshu infographic. Layout: real map with annotations, using an authentic map outline, streets, waterways, or regional relationships as the main visual. Place location markers, very short explanations, and a few small icons on the map. Keep annotations away from important features, maintain clear hierarchy, and use a simple legend rather than a dense list." data-name="真实地图标注型信息图" data-name-zh="真实地图标注型信息图" data-name-en="Geographic Map with Annotations" aria-label="查看 IG-021 真实地图标注型信息图"><img src="../../../images/layouts/infographics/IG-021.webp" alt="IG-021 真实地图标注型信息图"><span class="layout-info"><span class="layout-id">IG-021</span><span class="layout-name">真实地图标注型信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-022" data-category="infographic" data-image="../../../images/layouts/infographics/IG-022.webp" data-prompt="小红书信息图。排版：数字大字型，以一个或多个超大数字作为绝对视觉主体，周围只放极短解释、单位或对象名称。数字要占据主要面积并形成强烈冲击，其他元素弱化，背景大面积留白，不加入复杂图表。" data-prompt-zh="小红书信息图。排版：数字大字型，以一个或多个超大数字作为绝对视觉主体，周围只放极短解释、单位或对象名称。数字要占据主要面积并形成强烈冲击，其他元素弱化，背景大面积留白，不加入复杂图表。" data-prompt-en="Xiaohongshu infographic. Layout: oversized-number type, using one or more huge numbers as the absolute visual focus. Surround them only with very short explanations, units, or object names. Let the numbers occupy the main area with strong impact, subordinate all other elements, keep the background generously empty, and avoid complex charts." data-name="数字大字型信息图" data-name-zh="数字大字型信息图" data-name-en="Big Number Stat Highlight Infographic" aria-label="查看 IG-022 数字大字型信息图"><img src="../../../images/layouts/infographics/IG-022.webp" alt="IG-022 数字大字型信息图"><span class="layout-info"><span class="layout-id">IG-022</span><span class="layout-name">数字大字型信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-023" data-category="infographic" data-image="../../../images/layouts/infographics/IG-023.webp" data-prompt="小红书信息图。排版：排行榜型，按1、2、3、4、5的明确顺序排列对象。每个对象配一个小图、名称和一项核心数据，可采用纵向排行、奖台或错落分层结构。重点突出名次差异和第一视觉对象，避免退化成普通无序清单。" data-prompt-zh="小红书信息图。排版：排行榜型，按1、2、3、4、5的明确顺序排列对象。每个对象配一个小图、名称和一项核心数据，可采用纵向排行、奖台或错落分层结构。重点突出名次差异和第一视觉对象，避免退化成普通无序清单。" data-prompt-en="Xiaohongshu infographic. Layout: ranking type, arranging objects in an explicit order such as 1, 2, 3, 4, and 5. Pair each object with a small visual, a name, and one core metric. Use a vertical ranking, podium, or staggered tiered structure, emphasizing rank differences and the leading entry rather than making a generic unordered list." data-name="排行榜型信息图" data-name-zh="排行榜型信息图" data-name-en="Leaderboard Ranking Infographic" aria-label="查看 IG-023 排行榜型信息图"><img src="../../../images/layouts/infographics/IG-023.webp" alt="IG-023 排行榜型信息图"><span class="layout-info"><span class="layout-id">IG-023</span><span class="layout-name">排行榜型信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-024" data-category="infographic" data-image="../../../images/layouts/infographics/IG-024.webp" data-prompt="小红书信息图。排版：比例构成型，使用圆环图、饼图、100人图标或色块面积表达整体中各部分所占比例。设置清晰图例和少量百分比标注，主图最大，说明简短，颜色区分明确，留白充足，避免堆叠过多指标。" data-prompt-zh="小红书信息图。排版：比例构成型，使用圆环图、饼图、100人图标或色块面积表达整体中各部分所占比例。设置清晰图例和少量百分比标注，主图最大，说明简短，颜色区分明确，留白充足，避免堆叠过多指标。" data-prompt-en="Xiaohongshu infographic. Layout: part-to-whole composition, using a donut chart, pie chart, 100-person icons, or area blocks to show how much each part contributes to the whole. Include a clear legend and only a few percentage labels. Make the main chart dominant, keep explanations short, distinguish colors clearly, and avoid too many metrics." data-name="比例构成型信息图" data-name-zh="比例构成型信息图" data-name-en="Part-to-Whole Composition Infographic" aria-label="查看 IG-024 比例构成型信息图"><img src="../../../images/layouts/infographics/IG-024.webp" alt="IG-024 比例构成型信息图"><span class="layout-info"><span class="layout-id">IG-024</span><span class="layout-name">比例构成型信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-025" data-category="infographic" data-image="../../../images/layouts/infographics/IG-025.webp" data-prompt="小红书信息图。排版：尺度比较型，让多个对象按真实或相对大小从小到大排列，视觉尺寸本身直接传递比较信息。对象高度概括，配极短名称或阶段标签，用基线、箭头或少量刻度强化递进关系，保持构图简单和大面积留白。" data-prompt-zh="小红书信息图。排版：尺度比较型，让多个对象按真实或相对大小从小到大排列，视觉尺寸本身直接传递比较信息。对象高度概括，配极短名称或阶段标签，用基线、箭头或少量刻度强化递进关系，保持构图简单和大面积留白。" data-prompt-en="Xiaohongshu infographic. Layout: scale comparison, arranging multiple objects from small to large according to real or relative size so that visual scale itself communicates the comparison. Keep objects highly simplified, add only very short names or stage labels, and use a baseline, arrow, or a few marks to reinforce progression. Keep the composition simple with generous negative space." data-name="尺度比较型信息图" data-name-zh="尺度比较型信息图" data-name-en="Scale Comparison Infographic" aria-label="查看 IG-025 尺度比较型信息图"><img src="../../../images/layouts/infographics/IG-025.webp" alt="IG-025 尺度比较型信息图"><span class="layout-info"><span class="layout-id">IG-025</span><span class="layout-name">尺度比较型信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-026" data-category="infographic" data-image="../../../images/layouts/infographics/IG-026.webp" data-prompt="小红书信息图。排版：拆解爆炸图型，一个完整物体作为主体，多个零件或组件从主体中分离并围绕主体展开，用引导线说明每个组件的名称、用途或组成关系。重点表现“由什么组成”，不要做成普通标注图；角色高度概括，构图简单，大量留白。" data-prompt-zh="小红书信息图。排版：拆解爆炸图型，一个完整物体作为主体，多个零件或组件从主体中分离并围绕主体展开，用引导线说明每个组件的名称、用途或组成关系。重点表现“由什么组成”，不要做成普通标注图；角色高度概括，构图简单，大量留白。" data-prompt-en="Xiaohongshu infographic. Layout: exploded-view type, with one complete object as the main subject and multiple parts separated and expanded around it. Use leader lines to identify each component and explain its purpose or compositional relationship. Emphasize what the object is made of rather than making a generic annotation diagram. Keep characters highly simplified, the composition simple, and the negative space generous." data-name="拆解爆炸图型信息图" data-name-zh="拆解爆炸图型信息图" data-name-en="Exploded Assembly View Infographic" aria-label="查看 IG-026 拆解爆炸图型信息图"><img src="../../../images/layouts/infographics/IG-026.webp" alt="IG-026 拆解爆炸图型信息图"><span class="layout-info"><span class="layout-id">IG-026</span><span class="layout-name">拆解爆炸图型信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-027" data-category="infographic" data-image="../../../images/layouts/infographics/IG-027.webp" data-prompt="小红书信息图。排版：剖面 / 截面型，把一个整体建筑或物体切开，直接展示内部空间、楼层和功能分区。剖面主视觉占据主要面积，旁侧配置少量楼层标签或极短说明，切口和内部结构必须完整可读，角色高度概括，保留大量留白。" data-prompt-zh="小红书信息图。排版：剖面 / 截面型，把一个整体建筑或物体切开，直接展示内部空间、楼层和功能分区。剖面主视觉占据主要面积，旁侧配置少量楼层标签或极短说明，切口和内部结构必须完整可读，角色高度概括，保留大量留白。" data-prompt-en="Xiaohongshu infographic. Layout: sectional or cutaway type, slicing an integrated building or object open to reveal its interior spaces, floors, and functional zones. Let the cutaway be the dominant visual, with only a few floor labels or very short notes alongside it. Keep the cut edge and internal structure fully readable, simplify characters, and preserve generous negative space." data-name="剖面截面型信息图" data-name-zh="剖面截面型信息图" data-name-en="Cutaway Sectional View Infographic" aria-label="查看 IG-027 剖面截面型信息图"><img src="../../../images/layouts/infographics/IG-027.webp" alt="IG-027 剖面截面型信息图"><span class="layout-info"><span class="layout-id">IG-027</span><span class="layout-name">剖面截面型信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-028" data-category="infographic" data-image="../../../images/layouts/infographics/IG-028.webp" data-prompt="小红书信息图。排版：连续场景型，整张图是一幅连贯的空间或时间场景，多个信息节点自然藏在道路、人物、建筑和道具中。不要拆成卡片或规则网格；用场景关系串联信息，角色高度概括，构图简洁，保留大片天空、地面或背景留白。" data-prompt-zh="小红书信息图。排版：连续场景型，整张图是一幅连贯的空间或时间场景，多个信息节点自然藏在道路、人物、建筑和道具中。不要拆成卡片或规则网格；用场景关系串联信息，角色高度概括，构图简洁，保留大片天空、地面或背景留白。" data-prompt-en="Xiaohongshu infographic. Layout: continuous-scene type, with the entire image forming one connected spatial or temporal scene and multiple information nodes naturally embedded in paths, people, buildings, and props. Do not split it into cards or a rigid grid; connect information through the scene itself, simplify characters, keep the composition clean, and preserve broad areas of sky, ground, or background negative space." data-name="连续场景信息图" data-name-zh="连续场景信息图" data-name-en="Continuous Scene Panoramic Infographic" aria-label="查看 IG-028 连续场景信息图"><img src="../../../images/layouts/infographics/IG-028.webp" alt="IG-028 连续场景信息图"><span class="layout-info"><span class="layout-id">IG-028</span><span class="layout-name">连续场景信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-029" data-category="infographic" data-image="../../../images/layouts/infographics/IG-029.webp" data-prompt="小红书信息图。排版：人物群像 + 标签型，多个角色自由站位，不必形成规则宫格。每个角色配一个短标签或极短说明，角色之间保持清楚间距和视觉平衡，可用姿态、道具和大小差异表达区别。角色高度概括，背景大面积留白，避免复杂装饰。" data-prompt-zh="小红书信息图。排版：人物群像 + 标签型，多个角色自由站位，不必形成规则宫格。每个角色配一个短标签或极短说明，角色之间保持清楚间距和视觉平衡，可用姿态、道具和大小差异表达区别。角色高度概括，背景大面积留白，避免复杂装饰。" data-prompt-en="Xiaohongshu infographic. Layout: character group with labels, using multiple characters in free positions rather than a rigid grid. Pair each character with one short label or very brief explanation, keeping clear spacing and visual balance. Use posture, props, and size differences to distinguish them. Keep characters highly simplified, leave the background generously empty, and avoid complex decoration." data-name="人物群像标签型信息图" data-name-zh="人物群像标签型信息图" data-name-en="Character Ensemble Label Infographic" aria-label="查看 IG-029 人物群像标签型信息图"><img src="../../../images/layouts/infographics/IG-029.webp" alt="IG-029 人物群像标签型信息图"><span class="layout-info"><span class="layout-id">IG-029</span><span class="layout-name">人物群像标签型信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-030" data-category="infographic" data-image="../../../images/layouts/infographics/IG-030.webp" data-prompt="小红书信息图。排版：一大多小知识图谱型，设置一个占据主要面积的大型核心图，作为画面最重要的视觉主体；在核心图周围分布若干尺寸明显更小的视觉单元，每个单元配一个极短标签、名称或说明。小单元围绕核心主题形成知识关联，但不要求规则网格或完全平均分布；通过留白、位置和适度连接表达整体关系。角色高度概括，构图简单，保留大量留白。" data-prompt-zh="小红书信息图。排版：一大多小知识图谱型，设置一个占据主要面积的大型核心图，作为画面最重要的视觉主体；在核心图周围分布若干尺寸明显更小的视觉单元，每个单元配一个极短标签、名称或说明。小单元围绕核心主题形成知识关联，但不要求规则网格或完全平均分布；通过留白、位置和适度连接表达整体关系。角色高度概括，构图简单，保留大量留白。" data-prompt-en="Place one large core illustration occupying the main visual area as the primary subject. Distribute several clearly smaller visual units around it, with each unit paired with a very short label, name, or explanation. Let the smaller units form knowledge relationships around the core topic without requiring a rigid grid or perfectly even distribution. Use negative space, position, and light connections to express the overall relationship. Keep characters highly simplified, use a simple composition, and preserve generous negative space." data-name="一大多小知识图谱型信息图" data-name-zh="一大多小知识图谱型信息图" data-name-en="Core Hero Knowledge Map Infographic" aria-label="查看 IG-030 一大多小知识图谱型信息图"><img src="../../../images/layouts/infographics/IG-030.webp" alt="IG-030 一大多小知识图谱型信息图"><span class="layout-info"><span class="layout-id">IG-030</span><span class="layout-name">一大多小知识图谱型信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-031" data-category="infographic" data-image="../../../images/layouts/infographics/IG-031.webp" data-prompt="小红书信息图。排版：百科全书式信息卡。采用“顶部主标本展示区 + 中部非对称多模块信息区 + 底部资料来源区”的三段式结构。顶部以主视觉实物/标本为核心，搭配标题、学名/副标题、分类标签与少量基础信息。中部通过细线网格、坐标系统和黄金分割组织6–10个信息模块，混合小标题、短文、图解、对比、数据条、地图、时间轴等形式，整体图文混排、秩序清晰、留白充足。底部设置弱化的编号、注释或来源说明区，整体呈现标本馆档案与现代博物馆导览牌融合的理性设计感。" data-prompt-zh="小红书信息图。排版：百科全书式信息卡。采用“顶部主标本展示区 + 中部非对称多模块信息区 + 底部资料来源区”的三段式结构。顶部以主视觉实物/标本为核心，搭配标题、学名/副标题、分类标签与少量基础信息。中部通过细线网格、坐标系统和黄金分割组织6–10个信息模块，混合小标题、短文、图解、对比、数据条、地图、时间轴等形式，整体图文混排、秩序清晰、留白充足。底部设置弱化的编号、注释或来源说明区，整体呈现标本馆档案与现代博物馆导览牌融合的理性设计感。" data-prompt-en="Xiaohongshu infographic. Layout: Encyclopedic information card. Structured in three tiers: &quot;top primary specimen display zone + middle asymmetrical multi-module information zone + bottom source reference zone&quot;. The top is centered around a primary visual object/specimen, accompanied by the main title, scientific name/subtitle, classification tags, and concise foundational details. The middle section organizes 6–10 information modules through hairline grids, coordinate systems, and golden-ratio compositions, integrating subheadings, short paragraphs, diagrams, comparative charts, data bars, maps, and timelines into a well-ordered, generous typographic balance. The bottom contains an understated numbering, footnote, or reference citation area, presenting a rational design aesthetic combining herbarium archival sheets with contemporary museum exhibition boards." data-name="百科全书式信息卡" data-name-zh="百科全书式信息卡" data-name-en="Encyclopedic Specimen Information Card" aria-label="查看 IG-031 百科全书式信息卡"><img src="../../../images/layouts/infographics/IG-031.webp" alt="IG-031 百科全书式信息卡"><span class="layout-info"><span class="layout-id">IG-031</span><span class="layout-name">百科全书式信息卡</span></span></button>
<button class="layout-card" type="button" data-id="IG-032" data-category="infographic" data-image="../../../images/layouts/infographics/IG-032.webp" data-prompt="小红书信息图。排版：手绘编辑式知识信息图。采用“顶部超大标题 + 中部大型核心主视觉 + 周边多个带数字编号的知识点模块 + 底部总结区”的构图。核心主视觉明显大于其他元素，作为全图视觉中心；周围自然环绕分布4–8个知识点模块，每个模块带有清晰醒目的数字序号（如01、02、03、04）建立列表感与阅读动线。每个编号模块包含短标题、简短说明和一个小型视觉解释（如小场景插图、图标、对比、流程、思维泡泡或微型漫画）。模块围绕核心视觉灵活排布，非僵硬规则宫格，允许箭头、标签、对话气泡与手写注释穿插连接。底部设置一句话总结、关键词提炼或checklist清单区收束全图。整体呈现杂志编辑插画、知识信息图与轻漫画叙事融合的生动手绘质感。角色高度概括，构图简洁，较多留白。" data-prompt-zh="小红书信息图。排版：手绘编辑式知识信息图。采用“顶部超大标题 + 中部大型核心主视觉 + 周边多个带数字编号的知识点模块 + 底部总结区”的构图。核心主视觉明显大于其他元素，作为全图视觉中心；周围自然环绕分布4–8个知识点模块，每个模块带有清晰醒目的数字序号（如01、02、03、04）建立列表感与阅读动线。每个编号模块包含短标题、简短说明和一个小型视觉解释（如小场景插图、图标、对比、流程、思维泡泡或微型漫画）。模块围绕核心视觉灵活排布，非僵硬规则宫格，允许箭头、标签、对话气泡与手写注释穿插连接。底部设置一句话总结、关键词提炼或checklist清单区收束全图。整体呈现杂志编辑插画、知识信息图与轻漫画叙事融合的生动手绘质感。角色高度概括，构图简洁，较多留白。" data-prompt-en="Xiaohongshu infographic. Layout: Hand-drawn editorial knowledge infographic. Structured as &quot;top oversized headline + central prominent hero visual + surrounding numbered knowledge modules + bottom summary section&quot;. The central hero visual is substantially larger than other elements, serving as the dominant visual focal point. 4 to 8 knowledge modules surround the core illustration naturally, each bearing a prominent numbered badge (such as 01, 02, 03, 04) to establish a clear reading sequence and list structure. Each numbered module contains a concise title, brief explanation, and miniature visual breakdown (such as mini-scene illustrations, icons, comparisons, process flows, thought bubbles, or mini comic panels). Modules flow organically around the core visual rather than adhering to a rigid grid, connected flexibly by arrows, tags, speech bubbles, and handwritten notes. The bottom features a concluding one-line takeaway, keywords, or checklist. The overall composition merges magazine editorial illustration, knowledge infographic diagramming, and light comic narrative into a lively hand-drawn aesthetic. Keep characters highly simplified, use a concise composition, and preserve generous negative space." data-name="手绘编辑式知识信息图" data-name-zh="手绘编辑式知识信息图" data-name-en="Hand-Drawn Editorial Knowledge Infographic" aria-label="查看 IG-032 手绘编辑式知识信息图"><img src="../../../images/layouts/infographics/IG-032.webp" alt="IG-032 手绘编辑式知识信息图"><span class="layout-info"><span class="layout-id">IG-032</span><span class="layout-name">手绘编辑式知识信息图</span></span></button>
<button class="layout-card" type="button" data-id="IG-033" data-category="infographic" data-image="../../../images/layouts/infographics/IG-033.webp" data-prompt="小红书信息图。排版：讲义式高密分析信息图。一页高信息密度的讲义式分析排版，整体呈现“先总览、再分解、再总结”的清晰结构。顶部设置主标题栏与核心要点/速览区；中部为主体分析区，由多个带编号的独立分析卡片模块组成，各模块包含要点小标题、项目符号清单、公式框与局部图解说明，并穿插表格容器、步骤流程区与思维导图/流程连接区，通过不同大小的内容区形成丰富的视觉节奏；底部设置通栏重点结论区与易错提醒/避坑说明区，辅以边缘补充说明区与角落批注小框。版面遵循从上到下、从左到右的严谨阅读顺序，分区明确、容器边框分明，不做海报式单一视觉中心布局，不做机械均分网格，不添加知识点以外的纯装饰性图像元素。" data-prompt-zh="小红书信息图。排版：讲义式高密分析信息图。一页高信息密度的讲义式分析排版，整体呈现“先总览、再分解、再总结”的清晰结构。顶部设置主标题栏与核心要点/速览区；中部为主体分析区，由多个带编号的独立分析卡片模块组成，各模块包含要点小标题、项目符号清单、公式框与局部图解说明，并穿插表格容器、步骤流程区与思维导图/流程连接区，通过不同大小的内容区形成丰富的视觉节奏；底部设置通栏重点结论区与易错提醒/避坑说明区，辅以边缘补充说明区与角落批注小框。版面遵循从上到下、从左到右的严谨阅读顺序，分区明确、容器边框分明，不做海报式单一视觉中心布局，不做机械均分网格，不添加知识点以外的纯装饰性图像元素。" data-prompt-en="Xiaohongshu infographic. Layout: High-density handout analytical infographic. A single-page, high-density structured study handout layout following a clear &quot;overview, breakdown, and summary&quot; visual hierarchy. The top features a prominent main header bar paired with a core key takeaways/overview panel. The middle section serves as the core analytical body, composed of multiple sequentially numbered modular cards featuring subheadings, bullet points, formula containers, and localized diagrammatic explanations, flexibly interspersed with structured table containers, step-by-step procedure sequences, and flowchart/decision-tree connection zones to create an engaging visual rhythm across varied block sizes. The bottom anchors the page with full-width key conclusion and warning/error-alert callout sections, complemented by marginal annotations and compact corner callout boxes. The layout follows a strict top-to-bottom, left-to-right reading order with distinct container boundaries and structured card frames; avoids single-focal-point poster composition, avoids rigid equal grids, and strictly excludes decorative imagery outside essential informational diagrams." data-name="讲义式高密分析信息图" data-name-zh="讲义式高密分析信息图" data-name-en="High-Density Handout Analytical Infographic" aria-label="查看 IG-033 讲义式高密分析信息图"><img src="../../../images/layouts/infographics/IG-033.webp" alt="IG-033 讲义式高密分析信息图"><span class="layout-info"><span class="layout-id">IG-033</span><span class="layout-name">讲义式高密分析信息图</span></span></button>
<button class="layout-card" type="button" data-id="SB-001" data-category="comic-storyboard" data-image="../../../images/layouts/comic-storyboards/SB-001.webp" data-prompt="漫画分镜。排版：规则网格，所有面板大小接近、排列整齐，阅读顺序最稳定，适合日常和对白故事。让该分镜机制决定页面结构、阅读顺序、主次画格和镜头节奏；输出一张完整单页漫画页面，画格共同讲述连续情节，角色外观在各格保持一致。" data-prompt-zh="漫画分镜。排版：规则网格，所有面板大小接近、排列整齐，阅读顺序最稳定，适合日常和对白故事。让该分镜机制决定页面结构、阅读顺序、主次画格和镜头节奏；输出一张完整单页漫画页面，画格共同讲述连续情节，角色外观在各格保持一致。" data-prompt-en="Comic storyboard. Layout: Regular Grid, panels of equal size arranged neatly in a consistent reading order, ideal for slice-of-life and dialogue-driven stories. Let this storyboard mechanism determine the page structure, reading flow, panel hierarchy, and pacing; output a complete single-page comic where panels tell a continuous story with consistent characters." data-name="规则网格" data-name-zh="规则网格" data-name-en="Regular Grid" aria-label="查看 SB-001 规则网格"><img src="../../../images/layouts/comic-storyboards/SB-001.webp" alt="SB-001 规则网格"><span class="layout-info"><span class="layout-id">SB-001</span><span class="layout-name">规则网格</span></span></button>
<button class="layout-card" type="button" data-id="SB-002" data-category="comic-storyboard" data-image="../../../images/layouts/comic-storyboards/SB-002.webp" data-prompt="漫画分镜。排版：四格起承转合，四个等格依次承担铺垫、发展、转折和包袱，适合短笑话。让该分镜机制决定页面结构、阅读顺序、主次画格和镜头节奏；输出一张完整单页漫画页面，画格共同讲述连续情节，角色外观在各格保持一致。" data-prompt-zh="漫画分镜。排版：四格起承转合，四个等格依次承担铺垫、发展、转折和包袱，适合短笑话。让该分镜机制决定页面结构、阅读顺序、主次画格和镜头节奏；输出一张完整单页漫画页面，画格共同讲述连续情节，角色外观在各格保持一致。" data-prompt-en="Comic storyboard. Layout: Four-Panel Kishōtenketsu, four equal panels sequentially presenting introduction, development, twist, and punchline, ideal for short comedic stories. Let this storyboard mechanism determine the page structure, reading flow, panel hierarchy, and pacing; output a complete single-page comic where panels tell a continuous story with consistent characters." data-name="四格起承转合" data-name-zh="四格起承转合" data-name-en="Four-Panel Kishōtenketsu" aria-label="查看 SB-002 四格起承转合"><img src="../../../images/layouts/comic-storyboards/SB-002.webp" alt="SB-002 四格起承转合"><span class="layout-info"><span class="layout-id">SB-002</span><span class="layout-name">四格起承转合</span></span></button>
<button class="layout-card" type="button" data-id="SB-003" data-category="comic-storyboard" data-image="../../../images/layouts/comic-storyboards/SB-003.webp" data-prompt="漫画分镜。排版：大格 + 小格，一个主画面占据大面积，其余小格补充过程、反应或细节。让该分镜机制决定页面结构、阅读顺序、主次画格和镜头节奏；输出一张完整单页漫画页面，画格共同讲述连续情节，角色外观在各格保持一致。" data-prompt-zh="漫画分镜。排版：大格 + 小格，一个主画面占据大面积，其余小格补充过程、反应或细节。让该分镜机制决定页面结构、阅读顺序、主次画格和镜头节奏；输出一张完整单页漫画页面，画格共同讲述连续情节，角色外观在各格保持一致。" data-prompt-en="Comic storyboard. Layout: Hero Panel + Inset Panels, one prominent large panel occupies primary area, supported by smaller secondary panels for reactions or details. Let this storyboard mechanism determine the page structure, reading flow, panel hierarchy, and pacing; output a complete single-page comic where panels tell a continuous story with consistent characters." data-name="大格 + 小格" data-name-zh="大格 + 小格" data-name-en="Hero Panel + Inset Panels" aria-label="查看 SB-003 大格 + 小格"><img src="../../../images/layouts/comic-storyboards/SB-003.webp" alt="SB-003 大格 + 小格"><span class="layout-info"><span class="layout-id">SB-003</span><span class="layout-name">大格 + 小格</span></span></button>
<button class="layout-card" type="button" data-id="SB-004" data-category="comic-storyboard" data-image="../../../images/layouts/comic-storyboards/SB-004.webp" data-prompt="漫画分镜。排版：顶部大格开场，用横跨页面的大面板建立场景和人物关系，下面再进入连续叙事。让该分镜机制决定页面结构、阅读顺序、主次画格和镜头节奏；输出一张完整单页漫画页面，画格共同讲述连续情节，角色外观在各格保持一致。" data-prompt-zh="漫画分镜。排版：顶部大格开场，用横跨页面的大面板建立场景和人物关系，下面再进入连续叙事。让该分镜机制决定页面结构、阅读顺序、主次画格和镜头节奏；输出一张完整单页漫画页面，画格共同讲述连续情节，角色外观在各格保持一致。" data-prompt-en="Comic storyboard. Layout: Top Splash Panel Opening, wide banner panel across top establishing scene and characters before subsequent sequential narrative below. Let this storyboard mechanism determine the page structure, reading flow, panel hierarchy, and pacing; output a complete single-page comic where panels tell a continuous story with consistent characters." data-name="顶部大格开场" data-name-zh="顶部大格开场" data-name-en="Top Splash Panel Opening" aria-label="查看 SB-004 顶部大格开场"><img src="../../../images/layouts/comic-storyboards/SB-004.webp" alt="SB-004 顶部大格开场"><span class="layout-info"><span class="layout-id">SB-004</span><span class="layout-name">顶部大格开场</span></span></button>

<button class="layout-card" type="button" data-id="SB-067" data-category="comic-storyboard" data-image="../../../images/layouts/comic-storyboards/SB-067.webp" data-prompt="漫画分镜。排版：色块主导式，不同色块充当面板边界或情绪区域，比传统黑框更设计化。让该分镜机制决定页面结构、阅读顺序、主次画格和镜头节奏；输出一张完整单页漫画页面，画格共同讲述连续情节，角色外观在各格保持一致。" data-prompt-zh="漫画分镜。排版：色块主导式，不同色块充当面板边界或情绪区域，比传统黑框更设计化。让该分镜机制决定页面结构、阅读顺序、主次画格和镜头节奏；输出一张完整单页漫画页面，画格共同讲述连续情节，角色外观在各格保持一致。" data-prompt-en="Comic storyboard. Layout: Color Block Panel Partitions, distinct solid color blocks serving as panel dividers and emotional mood zones rather than black lines. Let this storyboard mechanism determine the page structure, reading flow, panel hierarchy, and pacing; output a complete single-page comic where panels tell a continuous story with consistent characters." data-name="色块主导式" data-name-zh="色块主导式" data-name-en="Color Block Panel Partitions" aria-label="查看 SB-067 色块主导式"><img src="../../../images/layouts/comic-storyboards/SB-067.webp" alt="SB-067 色块主导式"><span class="layout-info"><span class="layout-id">SB-067</span><span class="layout-name">色块主导式</span></span></button>

<dialog id="wechat-modal" aria-labelledby="wechat-title" style="width:min(94vw,560px);padding:22px;border:0;border-radius:14px;background:#1e1b18;color:#fff;box-shadow:0 20px 70px #000a;text-align:center"><button class="close" type="button" aria-label="关闭" style="position:absolute;top:12px;right:12px;border:0;border-radius:7px;padding:5px 9px;background:#fff;color:#24211e;cursor:pointer;font:inherit">关闭 ×</button><h3 id="wechat-title" style="margin:4px 0 10px;font-size:17px;color:#fff" data-i18n="wechatTitle">💬 创作变现交流群</h3><p style="margin:0 0 4px;font-size:14px;color:#eee" data-i18n="wechatSub">请优先加群，满了的话也可以尝试加我个人微信</p><p style="margin:0 0 16px;font-size:13px;color:#d67d4d;font-weight:600" data-i18n="wechatNote">请备注：手绘</p><div style="display:flex;justify-content:center;align-items:flex-start;gap:24px;flex-wrap:wrap"><div style="flex:1 1 200px;max-width:240px;background:#fff;padding:10px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.3)"><div style="color:#24211e;font-size:13px;font-weight:700;margin-bottom:6px" data-i18n="wechatGroupLabel">① 优先加入群聊</div><img src="../../../images/wechat_group.png" onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/yang0/handraw-style/master/images/wechat_group.png';" alt="手绘交流群二维码" style="display:block;width:100%;height:auto;border-radius:6px"></div><div style="flex:1 1 200px;max-width:240px;background:#fff;padding:10px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.3)"><div style="color:#24211e;font-size:13px;font-weight:700;margin-bottom:6px" data-i18n="wechatPersonalLabel">② 个人微信备用</div><img src="../../../images/wechat_personal.png" onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/yang0/handraw-style/master/images/wechat_personal.png';" alt="旺德福个人微信二维码" style="display:block;width:100%;height:auto;border-radius:6px"></div></div><div style="margin-top:16px;padding-top:12px;border-top:1px solid #332f2b;display:flex;justify-content:center;gap:16px;font-size:13px"><a href="https://github.com/yang0/handraw-style" target="_blank" rel="noopener noreferrer" style="color:#d67d4d;text-decoration:none;font-weight:600">GitHub 仓库 ↗</a><a href="https://x.com/yang02010" target="_blank" rel="noopener noreferrer" style="color:#d67d4d;text-decoration:none;font-weight:600">X @yang02010 ↗</a></div></dialog>
<script>
const cards=[...document.querySelectorAll('.layout-card')],filters=[...document.querySelectorAll('.filter')],sizeBtns=[...document.querySelectorAll('.size-btn')],dialog=document.querySelector('#preview'),preview=document.querySelector('#preview-image'),label=document.querySelector('#dialog-label'),copyButton=document.querySelector('#copy'),wechatBtn=document.querySelector('#wechat-btn'),wechatModal=document.querySelector('#wechat-modal'),langBtn=document.querySelector('#lang-btn');
let activePrompt='', activeCard=null;
const I18N = {
  zh: {
    pageTitle: "图型编号画廊",
    stylesNav: "风格画廊",
    layoutsNav: "图型画廊",
    colorsNav: "色彩画廊",
    tutorialsNav: "提示词",
    wechatBtn: "💬 创作变现交流群",
    title: "图型编号画廊",
    sizeLabel: "尺寸",
    lead: "浏览排版图型，点击缩略图放大查看并复制对应排版提示词。",
    copyBtn: "复制排版提示词",
    copied: "已复制",
    copyFailed: "复制失败",
    closeBtn: "关闭 ×",
    dialogTip: "图片出于展示目的做了压缩，AI出的图字迹是很清晰的",
    wechatTitle: "💬 创作变现交流群",
    wechatSub: "请优先加群，满了的话也可以尝试加我个人微信",
    wechatNote: "请备注：手绘",
    wechatGroupLabel: "① 优先加入群聊",
    wechatPersonalLabel: "② 个人微信备用",
    langBtn: "🌐 English"
  },
  en: {
    pageTitle: "Layout Numbered Gallery",
    stylesNav: "Styles",
    layoutsNav: "Layouts",
    colorsNav: "Colors",
    tutorialsNav: "Prompts",
    wechatBtn: "💬 Creator Community",
    title: "Layout Numbered Gallery",
    sizeLabel: "Size",
    lead: "Browse layout compositions. Click thumbnails to enlarge and copy layout prompts.",
    copyBtn: "Copy Layout Prompt",
    copied: "Copied!",
    copyFailed: "Copy failed",
    closeBtn: "Close ×",
    dialogTip: "Images are compressed for display; AI outputs are sharp and clear.",
    wechatTitle: "💬 Creator Monetization Community",
    wechatSub: "Please prioritize joining the group; if full, try adding personal WeChat",
    wechatNote: "Note: handdraw",
    wechatGroupLabel: "① Join Group (Priority)",
    wechatPersonalLabel: "② Personal WeChat (Fallback)",
    langBtn: "🌐 中文"
  }
};
let currentLang = localStorage.getItem('handdraw_lang') || ((navigator.language && navigator.language.startsWith('zh')) ? 'zh' : 'en');
function applyLang(lang) {
  currentLang = lang;
  localStorage.setItem('handdraw_lang', lang);
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = I18N[lang].pageTitle;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (I18N[lang] && I18N[lang][key]) {
      el.textContent = I18N[lang][key];
    }
  });
  document.querySelectorAll('.filter').forEach(btn => {
    const label = lang === 'en' ? btn.dataset.labelEn : btn.dataset.labelZh;
    if (btn.firstChild && btn.firstChild.nodeType === Node.TEXT_NODE) {
      btn.firstChild.textContent = label + ' ';
    }
  });
  document.querySelectorAll('.layout-card').forEach(card => {
    const name = lang === 'en' ? (card.dataset.nameEn || card.dataset.name) : card.dataset.nameZh;
    const nameSpan = card.querySelector('.layout-name');
    if (nameSpan) nameSpan.textContent = name;
    card.setAttribute('aria-label', (lang === 'en' ? 'View ' : '查看 ') + card.dataset.id + ' ' + name);
  });
  if (langBtn) langBtn.textContent = I18N[lang].langBtn;
  updateActivePrompt();
}
if (langBtn) {
  langBtn.addEventListener('click', () => {
    applyLang(currentLang === 'zh' ? 'en' : 'zh');
  });
}
applyLang(currentLang);

const gallery=document.querySelector('#gallery');let layoutFrame=0;
function scheduleLayout(){if(!layoutFrame)layoutFrame=requestAnimationFrame(arrangeCards);}
function arrangeCards(){
    layoutFrame=0;
    const focused=document.activeElement;
    const count=Number(getComputedStyle(gallery).getPropertyValue('--columns'))||1;
    const gap=parseFloat(getComputedStyle(gallery).getPropertyValue('--gap'))||0;
    const columns=Array.from({length:count},()=>{const column=document.createElement('div');column.className='masonry-column';return column;});
    gallery.replaceChildren(...columns);
    const heights=Array(count).fill(0);
    cards.filter(card=>!card.hidden).forEach(card=>{
        const index=heights.indexOf(Math.min(...heights));
        columns[index].append(card);
        heights[index]+=card.getBoundingClientRect().height+gap;
    });
    if(cards.includes(focused)&&!focused.hidden)focused.focus({preventScroll:true});
}
function setCategory(category){filters.forEach(button=>button.classList.toggle('is-active',button.dataset.category===category));cards.forEach(card=>{card.hidden=card.dataset.category!==category;});scheduleLayout();}
cards.forEach(card=>{const img=card.querySelector('img');img.addEventListener('load',scheduleLayout);img.addEventListener('error',scheduleLayout);});
let lastWidth=-1;
new ResizeObserver(entries=>{const width=entries[0].contentRect.width;if(width!==lastWidth){lastWidth=width;scheduleLayout();}}).observe(gallery);
window.addEventListener('resize',scheduleLayout);
if(document.fonts)document.fonts.ready.then(scheduleLayout);

function setSize(size){
  const targetSize=['1x','2x'].includes(size)?size:'2x';
  document.body.dataset.size=targetSize;
  localStorage.setItem('handdraw_layout_size',targetSize);
  sizeBtns.forEach(btn=>btn.classList.toggle('is-active',btn.dataset.size===targetSize));
  scheduleLayout();
}
sizeBtns.forEach(btn=>btn.addEventListener('click',()=>setSize(btn.dataset.size)));
const savedSize=localStorage.getItem('handdraw_layout_size');
if(savedSize)setSize(savedSize);else setSize('2x');
if(wechatBtn&&wechatModal){wechatBtn.addEventListener('click',()=>wechatModal.showModal());wechatModal.querySelector('.close').addEventListener('click',()=>wechatModal.close());wechatModal.addEventListener('click',event=>{if(event.target===wechatModal)wechatModal.close()});}

function updateActivePrompt(){
    if(!activeCard) return;
    activePrompt=(currentLang==='en'?activeCard.dataset.promptEn:activeCard.dataset.promptZh)||activeCard.dataset.prompt||'';
    const name = currentLang === 'en' ? (activeCard.dataset.nameEn || activeCard.dataset.name) : activeCard.dataset.nameZh;
    label.textContent=`${activeCard.querySelector('.layout-id').textContent} · ${name}`;
    if (preview) preview.alt=`${activeCard.dataset.id||''} ${name}`;
}
function openPreview(card){
    activeCard=card;
    preview.src=card.dataset.image;
    updateActivePrompt();
    copyButton.textContent=I18N[currentLang].copyBtn;
    dialog.showModal();
}
async function copyPrompt(){
    updateActivePrompt();
    try{
        await navigator.clipboard.writeText(activePrompt);
        copyButton.textContent=I18N[currentLang].copied;
        setTimeout(()=>{copyButton.textContent=I18N[currentLang].copyBtn;},1500);
    }catch{
        const area=document.createElement('textarea');
        area.value=activePrompt;
        area.style.position='fixed';
        area.style.opacity='0';
        document.body.append(area);
        area.select();
        document.execCommand('copy');
        area.remove();
        copyButton.textContent=I18N[currentLang].copied;
        setTimeout(()=>{copyButton.textContent=I18N[currentLang].copyBtn;},1500);
    }
}
filters.forEach(button=>button.addEventListener('click',()=>setCategory(button.dataset.category)));cards.forEach(card=>card.addEventListener('click',()=>openPreview(card)));copyButton.addEventListener('click',copyPrompt);dialog.querySelector('.close').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()});
const urlCat=new URLSearchParams(window.location.search).get('cat')||(window.location.hash?window.location.hash.replace(/^#/,''):'');
if(urlCat&&filters.some(b=>b.dataset.category===urlCat)){setCategory(urlCat);}else{setCategory('social-card');}
</script></body></html>
